<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ARC•READ — Хүсэлт</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070e;--bg-card:#0d0d1a;--bg-el:#111120;
  --border:rgba(255,255,255,0.07);--border-h:rgba(255,255,255,0.13);
  --text:#e4e4f0;--muted:#6b6b80;--dim:#9494a8;
  --cyan:oklch(0.72 0.17 195);--cyan-g:oklch(0.72 0.17 195/.2);--cyan-d:oklch(0.72 0.17 195/.1);
  --rose:oklch(0.65 0.22 15);--amber:oklch(0.82 0.16 85);
  --fh:'Space Grotesk',sans-serif;--fb:'DM Sans',sans-serif;
  --r:10px;--rl:14px;--mx:1100px;
}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;overflow-x:hidden;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg-el);border-radius:9px}
.hdr{position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);background:rgba(7,7,14,.9);backdrop-filter:blur(18px)}
.hdr-in{max-width:1280px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer}
.logo-icon{width:34px;height:34px;border-radius:9px;background:var(--bg-el);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.logo-txt{font-family:var(--fh);font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.logo-dot{color:var(--rose)}
.nav{display:flex;align-items:center;gap:2px}
.nl{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:500;color:var(--dim);cursor:pointer;transition:color .15s,background .15s}
.nl:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nl.act{color:var(--cyan);background:var(--cyan-d)}
.hdr-r{display:flex;align-items:center;gap:8px}
.btn-in{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb)}
.btn-reg{padding:5px 14px;border-radius:20px;background:var(--cyan);color:#07070e;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:var(--fb)}
/* HERO */
.hero{
  position:relative;overflow:hidden;border-bottom:1px solid var(--border);
  padding:52px 24px 44px;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 80% at 15% 40%,oklch(0.72 0.17 195/.08),transparent),
             radial-gradient(ellipse 50% 60% at 85% 20%,oklch(0.65 0.2 290/.08),transparent);
}
.hero-in{max-width:var(--mx);margin:0 auto;position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:rgba(255,255,255,.04);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;color:var(--cyan);margin-bottom:16px;letter-spacing:.04em}
.hero-title{font-family:var(--fh);font-size:clamp(24px,4vw,38px);font-weight:700;letter-spacing:-.03em;color:#fff;margin-bottom:8px}
.hero-sub{font-size:13px;color:var(--muted);max-width:560px;line-height:1.6}
/* LAYOUT */
.layout{max-width:var(--mx);margin:0 auto;padding:28px 24px 60px;display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar-col{order:-1}}
/* TOP 3 */
.top3-title{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.top3-bar{width:3px;height:16px;border-radius:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan-g)}
.top3-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}
@media(max-width:600px){.top3-grid{grid-template-columns:1fr}}
.pod{border-radius:var(--rl);padding:18px 16px;border:1px solid var(--border);background:var(--bg-card);position:relative;overflow:hidden}
.pod-1{border-color:oklch(0.82 0.16 85/.3);background:linear-gradient(140deg,oklch(0.82 0.16 85/.07),var(--bg-card))}
.pod-2{border-color:rgba(180,180,200,.12);background:linear-gradient(140deg,rgba(180,180,200,.04),var(--bg-card))}
.pod-3{border-color:oklch(0.65 0.22 15/.2);background:linear-gradient(140deg,oklch(0.65 0.22 15/.05),var(--bg-card))}
.pod-rank{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.pod-avatar{width:44px;height:44px;border-radius:10px;background:var(--bg-el);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:16px;font-weight:700;margin-bottom:8px}
.pod-name{font-family:var(--fh);font-size:14px;font-weight:700;color:#fff;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod-label{font-size:10px;color:var(--muted);margin-bottom:12px}
.pod-votes-lbl{font-size:10px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.pod-votes{font-family:var(--fh);font-size:20px;font-weight:700}
.pod-1 .pod-votes{color:var(--amber)}
.pod-2 .pod-votes{color:#b0b0c8}
.pod-3 .pod-votes{color:oklch(0.75 0.12 15)}
/* TABLE */
.tbl-wrap{border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;background:var(--bg-card)}
.tbl-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.25)}
.tbl-title{font-family:var(--fh);font-size:13px;font-weight:700;color:var(--text)}
.tbl-meta{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{padding:9px 16px;text-align:left;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:rgba(0,0,0,.2);border-bottom:1px solid var(--border)}
th:last-child{text-align:right}
td{padding:11px 16px;border-bottom:1px solid var(--border);font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.rank-cell{font-family:var(--fh);font-size:12px;font-weight:700;color:var(--muted);width:40px}
.req-badge{width:40px;height:40px;border-radius:9px;background:var(--bg-el);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:14px;font-weight:700;flex-shrink:0}
.req-name{font-weight:600;color:var(--text);margin-bottom:2px;font-family:var(--fh)}
.req-sub{font-size:11px;color:var(--muted)}
.votes-cell{font-family:var(--fh);font-weight:700;color:var(--cyan);text-align:right;white-space:nowrap}
.vote-btn{
  padding:5px 12px;border-radius:7px;
  border:1px solid var(--border);background:transparent;
  color:var(--dim);font-size:11px;font-weight:600;font-family:var(--fh);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.vote-btn:hover:not(:disabled){border-color:oklch(0.72 0.17 195/.5);color:var(--cyan);background:var(--cyan-d)}
.vote-btn.voted{color:var(--muted);cursor:default}
.vote-btn.vip-needed{color:oklch(0.82 0.16 85);border-color:oklch(0.82 0.16 85/.3);background:oklch(0.82 0.16 85/.07)}
/* SIDEBAR */
.add-form-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);
  padding:20px;position:sticky;top:76px;
}
.form-title{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.form-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.vip-required-notice{
  background:oklch(0.82 0.16 85/.08);border:1px solid oklch(0.82 0.16 85/.25);
  border-radius:var(--r);padding:10px 13px;font-size:12px;color:oklch(0.9 0.1 85);
  margin-bottom:16px;
}
.field{margin-bottom:14px}
.field-label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.03em}
.field-in{
  width:100%;padding:10px 13px;border-radius:var(--r);
  background:var(--bg-el);border:1px solid var(--border);
  color:var(--text);font-family:var(--fb);font-size:13px;outline:none;
  transition:border-color .15s;
}
.field-in::placeholder{color:var(--muted)}
.field-in:focus{border-color:oklch(0.72 0.17 195/.5)}
.submit-btn{
  width:100%;padding:11px;border-radius:var(--r);
  background:var(--cyan);color:#07070e;
  font-size:13px;font-weight:700;font-family:var(--fh);
  border:none;cursor:pointer;box-shadow:0 0 18px var(--cyan-g);
  transition:filter .15s;
}
.submit-btn:hover{filter:brightness(1.1)}
.submit-btn:disabled{background:var(--bg-el);color:var(--muted);box-shadow:none;cursor:default}
.month-badge{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid oklch(0.72 0.17 195/.25);background:var(--cyan-d);
  border-radius:5px;padding:2px 8px;font-size:10px;font-weight:600;color:var(--cyan);
}
/* VOTE MODAL */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(7,7,14,.92);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;padding:24px}
.modal{width:100%;max-width:380px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.7)}
.modal-hdr{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:var(--fh);font-size:15px;font-weight:700;color:#fff}
.modal-close{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-ph{aspect-ratio:3/4;background:repeating-linear-gradient(-45deg,#0d0d1a,#0d0d1a 5px,#111120 5px,#111120 10px);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-family:monospace}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;justify-content:flex-end;background:rgba(0,0,0,.2)}
.modal-vote-btn{padding:8px 20px;border-radius:var(--r);background:var(--cyan);color:#07070e;font-size:13px;font-weight:700;font-family:var(--fh);border:none;cursor:pointer}
.modal-cancel{padding:8px 16px;border-radius:var(--r);background:transparent;border:1px solid var(--border);color:var(--dim);font-size:13px;cursor:pointer;font-family:var(--fb)}
@media(max-width:640px){.nav{display:none}}
</style>
</head>
<body>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo} = React;

const MONTH = '2025-04';
const INIT_ITEMS = [
  {id:'1',title:'Omniscient Reader',votes:42,votesMonth:28,voted:false},
  {id:'2',title:'SSS-Class Suicide Hunter',votes:37,votesMonth:22,voted:false},
  {id:'3',title:'Return of the Disaster-Class Hero',votes:31,votesMonth:19,voted:false},
  {id:'4',title:'The Tutorial Tower of the Advanced Player',votes:26,votesMonth:14,voted:false},
  {id:'5',title:'Memorize',votes:21,votesMonth:11,voted:false},
  {id:'6',title:'Kill the Hero',votes:18,votesMonth:9,voted:false},
  {id:'7',title:'Ranker Who Lives a Second Time',votes:15,votesMonth:7,voted:false},
  {id:'8',title:'The Max Level Hero Has Returned',votes:11,votesMonth:5,voted:false},
];

function ArcMark(){
  return(
    <svg viewBox="0 0 48 48" width="22" height="22" fill="none">
      <path d="M8 28 C14 14 34 14 40 28" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
      <path d="M16 34 C20 30 28 30 32 34" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
      <circle cx="24" cy="12" r="3" fill="oklch(0.65 0.22 15)"/>
    </svg>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "isVip": true,
  "showForm": true
}/*EDITMODE-END*/;

function App(){
  const [tweaks,setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [items,setItems] = useState(INIT_ITEMS);
  const [newTitle,setNewTitle] = useState('');
  const [voteModal,setVoteModal] = useState(null);
  const [submitting,setSubmitting] = useState(false);
  const navItems=['Нүүр','Жагсаалт','Leaderboard','Хүсэлт','Профайл'];

  const sorted = useMemo(()=>[...items].sort((a,b)=>b.votesMonth-a.votesMonth),[items]);
  const top3 = sorted.slice(0,3);
  const podOrder = [top3[1],top3[0],top3[2]];
  const podRanks = [2,1,3];
  const podClass = r=>r===1?'pod-1':r===2?'pod-2':'pod-3';

  const doVote = (id)=>{
    if(!tweaks.isVip) return;
    setItems(prev=>prev.map(i=>i.id===id?{...i,votes:i.votes+1,votesMonth:i.votesMonth+1,voted:true}:i));
    setVoteModal(null);
  };

  const addRequest = (e)=>{
    e.preventDefault();
    if(!newTitle.trim()||!tweaks.isVip) return;
    setSubmitting(true);
    setTimeout(()=>{
      const newItem={id:String(Date.now()),title:newTitle.trim(),votes:1,votesMonth:1,voted:true};
      setItems(prev=>[newItem,...prev]);
      setNewTitle('');
      setSubmitting(false);
    },600);
  };

  return(
    <div style={{minHeight:'100vh'}}>
      <header className="hdr">
        <div className="hdr-in">
          <a className="logo" href="Arc Read Homepage.html">
            <div className="logo-icon"><ArcMark/></div>
            <span className="logo-txt">ARC<span className="logo-dot">•</span>READ</span>
          </a>
          <nav className="nav">
            {navItems.map((n,i)=><a key={n} className={`nl${i===3?' act':''}`}>{n}</a>)}
          </nav>
          <div className="hdr-r">
            <button className="btn-in">Нэвтрэх</button>
            <button className="btn-reg">Бүртгүүлэх</button>
          </div>
        </div>
      </header>

      <div className="hero">
        <div className="hero-in">
          <div className="hero-badge">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17 5.8 21.3l2.4-7.4L2 9.4h7.6z"/></svg>
            Уншигчийн хүсэлт
          </div>
          <h1 className="hero-title">Хүсэлтийн жагсаалт</h1>
          <p className="hero-sub">Хүссэн манхуагаа нэмж, бусдын хүсэлтэд санал өгнө үү. Хамгийн их саналтайг орчуулна.</p>
        </div>
      </div>

      <div className="layout">
        {/* MAIN */}
        <div>
          {/* TOP 3 */}
          <div className="top3-title"><div className="top3-bar"/>Энэ сарын шилдэг 3 <span className="month-badge">{MONTH}</span></div>
          <div className="top3-grid">
            {podOrder.map((r,i)=>r&&(
              <div key={r.id} className={`pod ${podClass(podRanks[i])}`}>
                <div className="pod-rank">#{podRanks[i]} {podRanks[i]===1?'🥇':podRanks[i]===2?'🥈':'🥉'}</div>
                <div className="pod-avatar">{r.title[0]}</div>
                <div className="pod-name">{r.title}</div>
                <div className="pod-label">Манхуа хүсэлт</div>
                <div className="pod-votes-lbl">Энэ сард</div>
                <div className="pod-votes">{r.votesMonth} санал</div>
              </div>
            ))}
          </div>

          {/* TABLE */}
          <div className="tbl-wrap">
            <div className="tbl-hdr">
              <div className="tbl-title">Бүх хүсэлт</div>
              <div className="tbl-meta">Энэ сарын санал</div>
            </div>
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Манхуа</th>
                  <th style={{textAlign:'right'}}>Энэ сард</th>
                  <th style={{textAlign:'right'}}>Нийт</th>
                  <th style={{textAlign:'right'}}>Санал</th>
                </tr>
              </thead>
              <tbody>
                {sorted.map((item,i)=>(
                  <tr key={item.id}>
                    <td className="rank-cell">#{i+1}</td>
                    <td>
                      <div style={{display:'flex',alignItems:'center',gap:12,cursor:'pointer'}} onClick={()=>setVoteModal(item)}>
                        <div className="req-badge">{item.title[0]}</div>
                        <div>
                          <div className="req-name">{item.title}</div>
                          <div className="req-sub">Манхуа хүсэлт</div>
                        </div>
                      </div>
                    </td>
                    <td className="votes-cell">{item.votesMonth}</td>
                    <td style={{textAlign:'right',color:'var(--dim)',fontFamily:'var(--fh)',fontWeight:600}}>{item.votes}</td>
                    <td style={{textAlign:'right'}}>
                      {!tweaks.isVip ? (
                        <button className="vote-btn vip-needed" onClick={()=>{}}>VIP шаардлагатай</button>
                      ) : item.voted ? (
                        <button className="vote-btn voted" disabled>✓ Санал өгсөн</button>
                      ) : (
                        <button className="vote-btn" onClick={()=>setVoteModal(item)}>Санал өгөх</button>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        {/* SIDEBAR */}
        <div className="sidebar-col">
          <div className="add-form-card">
            <div className="form-title">Хүсэлт нэмэх</div>
            <div className="form-sub">Хүссэн манхуагаа оруулаад бусдад санал өгүүлнэ үү</div>
            {!tweaks.isVip && (
              <div className="vip-required-notice">
                ⭐ Зөвхөн VIP хэрэглэгч хүсэлт нэмэх болон санал өгөх боломжтой.
              </div>
            )}
            <form onSubmit={addRequest}>
              <div className="field">
                <label className="field-label">Манхуа нэр</label>
                <input
                  className="field-in" placeholder="Жишээ: Solo Leveling"
                  value={newTitle} onChange={e=>setNewTitle(e.target.value)}
                  disabled={!tweaks.isVip}
                />
              </div>
              <div className="field">
                <label className="field-label">Зураг (сонголтоор)</label>
                <input className="field-in" type="file" accept="image/*" disabled={!tweaks.isVip}
                  style={{padding:'8px 10px',fontSize:11}}/>
              </div>
              <button className="submit-btn" type="submit" disabled={!tweaks.isVip||submitting||!newTitle.trim()}>
                {submitting?'Илгээж байна…':'Хүсэлт илгээх'}
              </button>
            </form>

            <div style={{marginTop:16,paddingTop:14,borderTop:'1px solid var(--border)',fontSize:11,color:'var(--muted)',lineHeight:1.6}}>
              Хамгийн их санал авсан хүсэлтийг дараагийн сард орчуулж эхэлнэ.
            </div>
          </div>
        </div>
      </div>

      {/* VOTE MODAL */}
      {voteModal && (
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setVoteModal(null)}>
          <div className="modal">
            <div className="modal-hdr">
              <div>
                <div style={{fontSize:11,color:'var(--muted)'}}>Санал өгөх</div>
                <div className="modal-title">{voteModal.title}</div>
              </div>
              <button className="modal-close" onClick={()=>setVoteModal(null)}>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
            </div>
            <div className="modal-ph" style={{height:200}}>
              <div style={{textAlign:'center',opacity:.4}}>
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                <div style={{fontSize:10,marginTop:4}}>cover placeholder</div>
              </div>
            </div>
            <div className="modal-foot">
              {voteModal.voted && <span style={{marginRight:'auto',fontSize:11,color:'var(--muted)'}}>Санал өгсөн байна</span>}
              {!tweaks.isVip && <span style={{marginRight:'auto',background:'oklch(0.82 0.16 85/.1)',border:'1px solid oklch(0.82 0.16 85/.3)',borderRadius:5,padding:'2px 8px',fontSize:10,color:'var(--amber)'}}>VIP хэрэгтэй</span>}
              <button className="modal-cancel" onClick={()=>setVoteModal(null)}>Болих</button>
              <button className="modal-vote-btn"
                disabled={voteModal.voted||!tweaks.isVip}
                onClick={()=>doVote(voteModal.id)}
                style={voteModal.voted||!tweaks.isVip?{opacity:.4,cursor:'default'}:{}}
              >
                {voteModal.voted?'Санал өгсөн':'Санал өгөх'}
              </button>
            </div>
          </div>
        </div>
      )}

      <TweaksPanel>
        <TweakSection label="Preview"/>
        <TweakToggle label="VIP user" tweakKey="isVip"/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
