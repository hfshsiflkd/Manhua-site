<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ARC•READ — Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070e;--bg-card:#0d0d1a;--bg-el:#111120;
  --border:rgba(255,255,255,0.07);--border-h:rgba(255,255,255,0.13);
  --text:#e4e4f0;--muted:#6b6b80;--dim:#9494a8;
  --cyan:oklch(0.72 0.17 195);--cyan-g:oklch(0.72 0.17 195/.18);--cyan-d:oklch(0.72 0.17 195/.1);
  --rose:oklch(0.65 0.22 15);--amber:oklch(0.82 0.16 85);
  --fh:'Space Grotesk',sans-serif;--fb:'DM Sans',sans-serif;
  --r:10px;--rl:14px;--mx:1100px;
}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;overflow-x:hidden;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg-el);border-radius:9px}
/* HEADER */
.hdr{position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);background:rgba(7,7,14,.9);backdrop-filter:blur(18px)}
.hdr-in{max-width:1280px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer}
.logo-icon{width:34px;height:34px;border-radius:9px;background:var(--bg-el);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.logo-txt{font-family:var(--fh);font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.logo-dot{color:var(--rose)}
.nav{display:flex;align-items:center;gap:2px}
.nl{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:500;color:var(--dim);text-decoration:none;cursor:pointer;transition:color .15s,background .15s}
.nl:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nl.act{color:var(--cyan);background:var(--cyan-d)}
.hdr-r{display:flex;align-items:center;gap:8px}
.btn-in{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb)}
.btn-reg{padding:5px 14px;border-radius:20px;background:var(--cyan);color:#07070e;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:var(--fb)}
/* HERO */
.hero{
  position:relative;overflow:hidden;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  padding:56px 24px 48px;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 80% at 10% 50%,oklch(0.72 0.17 195/.07),transparent),
             radial-gradient(ellipse 50% 60% at 90% 30%,oklch(0.65 0.22 15/.07),transparent);
  pointer-events:none;
}
.hero-in{max-width:var(--mx);margin:0 auto;position:relative;z-index:1}
.hero-badge{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--border);background:rgba(255,255,255,.04);
  border-radius:20px;padding:5px 14px;
  font-size:11px;font-weight:600;color:var(--dim);
  margin-bottom:18px;letter-spacing:.04em;text-transform:uppercase;
}
.hero-title{font-family:var(--fh);font-size:clamp(28px,4vw,44px);font-weight:700;letter-spacing:-.035em;color:#fff;margin-bottom:8px}
.hero-sub{font-size:13px;color:var(--muted);max-width:480px;margin-bottom:24px;line-height:1.6}
.hero-stats{display:flex;gap:6px;flex-wrap:wrap}
.hero-stat{
  padding:5px 13px;border-radius:20px;
  border:1px solid var(--border);background:rgba(255,255,255,.04);
  font-size:12px;color:var(--dim);
}
.hero-stat b{color:var(--text)}
/* PODIUM */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:0 auto 28px;max-width:var(--mx)}
.pod-card{
  position:relative;overflow:hidden;
  border-radius:var(--rl);padding:22px 20px;
  border:1px solid var(--border);
  background:var(--bg-card);
}
.pod-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 20% 20%,rgba(255,255,255,.04),transparent);
  pointer-events:none;
}
.pod-1{border-color:oklch(0.82 0.16 85/.3);background:linear-gradient(135deg,oklch(0.82 0.16 85/.08),var(--bg-card))}
.pod-2{border-color:rgba(180,180,200,.15);background:linear-gradient(135deg,rgba(180,180,200,.05),var(--bg-card))}
.pod-3{border-color:oklch(0.65 0.22 15/.2);background:linear-gradient(135deg,oklch(0.65 0.22 15/.06),var(--bg-card))}
.pod-rank{font-family:var(--fh);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.pod-rank-num{font-size:22px;font-weight:700;letter-spacing:-.03em}
.pod-1 .pod-rank-num{color:var(--amber)}
.pod-2 .pod-rank-num{color:#b0b0c8}
.pod-3 .pod-rank-num{color:oklch(0.75 0.12 15)}
.pod-avatar{
  width:44px;height:44px;border-radius:12px;
  background:var(--bg-el);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fh);font-size:16px;font-weight:700;color:var(--text);
  margin-bottom:10px;
}
.pod-name{font-family:var(--fh);font-size:16px;font-weight:700;color:#fff;margin-bottom:3px}
.pod-label{font-size:11px;color:var(--muted);margin-bottom:14px}
.pod-amount-lbl{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pod-amount{font-family:var(--fh);font-size:22px;font-weight:700;letter-spacing:-.02em}
.pod-1 .pod-amount{color:var(--amber)}
.pod-2 .pod-amount{color:#c8c8dc}
.pod-3 .pod-amount{color:oklch(0.8 0.1 15)}
/* TABLE */
.tbl-wrap{max-width:var(--mx);margin:0 auto;border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;background:var(--bg-card)}
.tbl-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.3)}
.tbl-title{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--text)}
.tbl-meta{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{padding:10px 20px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:rgba(0,0,0,.2);border-bottom:1px solid var(--border)}
th:last-child{text-align:right}
td{padding:12px 20px;border-bottom:1px solid var(--border);font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.tr-gold td{background:oklch(0.82 0.16 85/.04)}
.tr-silver td{background:rgba(180,180,200,.03)}
.tr-bronze td{background:oklch(0.65 0.22 15/.03)}
.rank-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:8px;
  font-family:var(--fh);font-size:12px;font-weight:700;
}
.r1{background:oklch(0.82 0.16 85/.15);color:var(--amber)}
.r2{background:rgba(180,180,200,.1);color:#c0c0d4}
.r3{background:oklch(0.65 0.22 15/.12);color:oklch(0.75 0.12 15)}
.rn{background:rgba(255,255,255,.05);color:var(--muted)}
.user-cell{display:flex;align-items:center;gap:12px}
.avatar{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:var(--bg-el);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fh);font-size:13px;font-weight:700;color:var(--text);
}
.user-name{font-weight:600;color:var(--text);margin-bottom:2px;font-family:var(--fh)}
.user-label{font-size:11px;color:var(--muted)}
.amount{font-family:var(--fh);font-weight:700;color:var(--amber);text-align:right}
/* PAGE */
.page{max-width:var(--mx);margin:0 auto;padding:32px 24px 60px}
@media(max-width:700px){
  .podium{grid-template-columns:1fr}
  .nav{display:none}
  th,td{padding:10px 12px}
}
</style>
</head>
<body>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

const ROWS = [
  {rank:1,name:'StarReader_MN',amount:480000},
  {rank:2,name:'ManhwaKing99',amount:360000},
  {rank:3,name:'Zunii_Nogoon',amount:290000},
  {rank:4,name:'DarkSolo',amount:215000},
  {rank:5,name:'CultivatorX',amount:188000},
  {rank:6,name:'TowerClimber',amount:162000},
  {rank:7,name:'LevelUpHunter',amount:143000},
  {rank:8,name:'OmniReader',amount:118000},
  {rank:9,name:'PeakMartial',amount:97000},
  {rank:10,name:'NanoWarrior',amount:84000},
  {rank:11,name:'GateCrusher',amount:73000},
  {rank:12,name:'ArkLight',amount:61000},
  {rank:13,name:'VoidWalker',amount:55000},
  {rank:14,name:'ShadowArcher',amount:48000},
  {rank:15,name:'DungeonBoss',amount:42000},
];

function fmt(n){return `${n.toLocaleString()} ₮`}

function ArcMark(){
  return(
    <svg viewBox="0 0 48 48" width="22" height="22" fill="none">
      <path d="M8 28 C14 14 34 14 40 28" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
      <path d="M16 34 C20 30 28 30 32 34" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
      <circle cx="24" cy="12" r="3" fill="oklch(0.65 0.22 15)"/>
    </svg>
  );
}

function Avatar({name}){
  return <div className="avatar">{(name||'?')[0].toUpperCase()}</div>;
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "currency": "MNT",
  "limit": "15"
}/*EDITMODE-END*/;

function App(){
  const [tweaks,setTweak] = useTweaks(TWEAK_DEFAULTS);
  const navItems=['Нүүр','Жагсаалт','Leaderboard','Хүсэлт','Профайл'];
  const top3 = ROWS.slice(0,3);
  const allRows = ROWS.slice(0,parseInt(tweaks.limit)||15);

  const rankClass = r=>r===1?'r1':r===2?'r2':r===3?'r3':'rn';
  const rowClass = r=>r===1?'tr-gold':r===2?'tr-silver':r===3?'tr-bronze':'';
  const podClass = r=>r===1?'pod-1':r===2?'pod-2':'pod-3';

  // podium order: 2nd, 1st, 3rd
  const podOrder = [top3[1],top3[0],top3[2]];
  const podRanks = [2,1,3];

  return(
    <div style={{minHeight:'100vh'}}>
      {/* HEADER */}
      <header className="hdr">
        <div className="hdr-in">
          <a className="logo" href="Arc Read Homepage.html">
            <div className="logo-icon"><ArcMark/></div>
            <span className="logo-txt">ARC<span className="logo-dot">•</span>READ</span>
          </a>
          <nav className="nav">
            {navItems.map((n,i)=>(
              <a key={n} className={`nl${i===2?' act':''}`}>{n}</a>
            ))}
          </nav>
          <div className="hdr-r">
            <button className="btn-in">Нэвтрэх</button>
            <button className="btn-reg">Бүртгүүлэх</button>
          </div>
        </div>
      </header>

      {/* HERO */}
      <div className="hero">
        <div className="hero-in">
          <div className="hero-badge">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="oklch(0.82 0.16 85)" strokeWidth="2">
              <path d="M8 4h8v3a4 4 0 01-8 0V4z"/><path d="M10.5 14.2c.5.5.9 1.1.9 1.8V18H9v2h6v-2h-2.4v-2c0-.7.3-1.3.9-1.8"/><path d="M16 5h3v2a4 4 0 01-3 3M8 5H5v2a4 4 0 003 3"/>
            </svg>
            Top Supporters
          </div>
          <h1 className="hero-title">Leaderboard</h1>
          <p className="hero-sub">ARC•READ-д хамгийн их хувь нэмэр оруулсан хэрэглэгчдийн жагсаалт.</p>
          <div className="hero-stats">
            <div className="hero-stat">Хугацаа: <b>Нийт</b></div>
            <div className="hero-stat">Валют: <b>{tweaks.currency}</b></div>
            <div className="hero-stat">Нийт: <b>{allRows.length}</b> хэрэглэгч</div>
          </div>
        </div>
      </div>

      <div className="page">
        {/* PODIUM */}
        <div className="podium">
          {podOrder.map((r,i)=>(
            <div key={r.rank} className={`pod-card ${podClass(podRanks[i])}`}>
              <div className="pod-rank">
                <span className="pod-rank-num">#{podRanks[i]}</span>
                <span>{podRanks[i]===1?'🥇':podRanks[i]===2?'🥈':'🥉'}</span>
              </div>
              <div className="pod-avatar">{r.name[0].toUpperCase()}</div>
              <div className="pod-name">{r.name}</div>
              <div className="pod-label">Top supporter</div>
              <div className="pod-amount-lbl">Нийт зарцуулсан</div>
              <div className="pod-amount">{fmt(r.amount)}</div>
            </div>
          ))}
        </div>

        {/* TABLE */}
        <div className="tbl-wrap">
          <div className="tbl-hdr">
            <div className="tbl-title">Бүрэн жагсаалт</div>
            <div className="tbl-meta">Амжилттай төлбөрөөр тооцогдсон</div>
          </div>
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>Хэрэглэгч</th>
                <th style={{textAlign:'right'}}>Нийт зарцуулсан</th>
              </tr>
            </thead>
            <tbody>
              {allRows.map(r=>(
                <tr key={r.rank} className={rowClass(r.rank)}>
                  <td>
                    <span className={`rank-badge ${rankClass(r.rank)}`}>
                      {r.rank<=3?['🥇','🥈','🥉'][r.rank-1]:`#${r.rank}`}
                    </span>
                  </td>
                  <td>
                    <div className="user-cell">
                      <Avatar name={r.name}/>
                      <div>
                        <div className="user-name">{r.name}</div>
                        <div className="user-label">Хэрэглэгч</div>
                      </div>
                    </div>
                  </td>
                  <td className="amount">{fmt(r.amount)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{marginTop:12,fontSize:11,color:'var(--muted)'}}>
          Зарцуулалт нь системд бүртгэгдсэн амжилттай VIP төлбөрөөр тооцогдоно.
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Display"/>
        <TweakSelect label="Currency" tweakKey="currency" options={[{label:'MNT (₮)',value:'MNT'},{label:'USD ($)',value:'USD'}]}/>
        <TweakSelect label="Show rows" tweakKey="limit" options={[{label:'Top 5',value:'5'},{label:'Top 10',value:'10'},{label:'Top 15',value:'15'}]}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
    <rect width="120" height="80" fill="#07070e"/>
    <rect width="120" height="14" fill="#0d0d1a"/>
    <circle cx="10" cy="7" r="3.5" fill="oklch(0.65 0.22 15)"/>
    <rect x="8" y="18" width="104" height="20" rx="3" fill="#0a0a14" opacity="0.8"/>
    <rect x="14" y="23" width="40" height="7" rx="2" fill="#1a1a2e"/>
    <rect x="8" y="42" width="32" height="30" rx="6" fill="#0d0d1a"/>
    <rect x="44" y="38" width="32" height="34" rx="6" fill="#0d0d1a" stroke="oklch(0.82 0.16 85/.3)" stroke-width="1"/>
    <rect x="80" y="44" width="32" height="28" rx="6" fill="#0d0d1a"/>
    <rect x="48" y="46" width="24" height="4" rx="2" fill="oklch(0.82 0.16 85)" opacity="0.5"/>
    <rect x="48" y="54" width="20" height="3" rx="1.5" fill="#fff" opacity="0.2"/>
    <rect x="48" y="61" width="18" height="5" rx="2" fill="oklch(0.82 0.16 85)" opacity="0.4"/>
  </svg>
</template>
</body>
</html>
