<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ARC•READ — Профайл</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070e;--bg-card:#0d0d1a;--bg-el:#111120;
  --border:rgba(255,255,255,0.07);--border-h:rgba(255,255,255,0.13);
  --text:#e4e4f0;--muted:#6b6b80;--dim:#9494a8;
  --cyan:oklch(0.72 0.17 195);--cyan-g:oklch(0.72 0.17 195/.2);--cyan-d:oklch(0.72 0.17 195/.1);
  --rose:oklch(0.65 0.22 15);--amber:oklch(0.82 0.16 85);
  --fh:'Space Grotesk',sans-serif;--fb:'DM Sans',sans-serif;
  --r:10px;--rl:14px;--mx:1100px;
}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;overflow-x:hidden;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg-el);border-radius:9px}
/* HEADER */
.hdr{position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);background:rgba(7,7,14,.9);backdrop-filter:blur(18px)}
.hdr-in{max-width:1280px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer}
.logo-icon{width:34px;height:34px;border-radius:9px;background:var(--bg-el);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.logo-txt{font-family:var(--fh);font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.logo-dot{color:var(--rose)}
.nav{display:flex;align-items:center;gap:2px}
.nl{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:500;color:var(--dim);text-decoration:none;cursor:pointer;transition:color .15s,background .15s}
.nl:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nl.act{color:var(--cyan);background:var(--cyan-d)}
.hdr-r{display:flex;align-items:center;gap:8px}
.btn-in{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb)}
.btn-reg{padding:5px 14px;border-radius:20px;background:var(--cyan);color:#07070e;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:var(--fb)}
/* PROFILE HERO */
.prof-hero{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,#0d0920 0%,var(--bg) 100%);
  border-bottom:1px solid var(--border);
  padding:40px 24px 0;
}
.prof-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 100% at 50% -10%,oklch(0.72 0.17 195/.1),transparent);
  pointer-events:none;
}
.prof-hero-in{max-width:var(--mx);margin:0 auto;position:relative;z-index:1;display:flex;align-items:flex-end;gap:24px;padding-bottom:0}
.prof-avatar-wrap{flex-shrink:0;margin-bottom:-24px}
.prof-avatar{
  width:88px;height:88px;border-radius:22px;
  background:linear-gradient(135deg,oklch(0.72 0.17 195),oklch(0.65 0.22 15));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fh);font-size:32px;font-weight:700;color:#fff;
  border:3px solid var(--bg);
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.prof-info{flex:1;min-width:0;padding-bottom:20px}
.prof-name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.prof-name{font-family:var(--fh);font-size:22px;font-weight:700;color:#fff;letter-spacing:-.02em}
.vip-badge{
  padding:3px 10px;border-radius:6px;
  font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  background:linear-gradient(135deg,var(--amber),oklch(0.7 0.18 60));
  color:#07070e;
}
.prof-join{font-size:12px;color:var(--muted);margin-bottom:12px}
.prof-stats{display:flex;gap:20px;flex-wrap:wrap}
.prof-stat{text-align:center}
.prof-stat-val{font-family:var(--fh);font-size:18px;font-weight:700;color:#fff}
.prof-stat-lbl{font-size:11px;color:var(--muted);margin-top:2px}
/* TABS */
.prof-tabs{max-width:var(--mx);margin:0 auto;padding:32px 24px 0 24px;display:flex;gap:0}
.prof-tab{
  padding:10px 20px;font-family:var(--fh);font-size:13px;font-weight:600;
  color:var(--muted);cursor:pointer;border:none;background:transparent;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;
}
.prof-tab:hover{color:var(--text)}
.prof-tab.on{color:var(--cyan);border-bottom-color:var(--cyan)}
.tab-divider{border:none;border-bottom:1px solid var(--border);margin:0}
/* CONTENT */
.prof-content{max-width:var(--mx);margin:0 auto;padding:28px 24px 60px;display:grid;grid-template-columns:1fr 300px;gap:24px}
/* CONTINUE READING */
.cr-title{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.cr-bar{width:3px;height:16px;border-radius:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan-g)}
.cr-list{display:flex;flex-direction:column;gap:3px}
.cr-item{
  display:flex;align-items:center;gap:14px;padding:12px 14px;
  border-radius:var(--r);border:1px solid var(--border);
  background:var(--bg-card);cursor:pointer;text-decoration:none;
  transition:border-color .15s,background .15s;
}
.cr-item:hover{border-color:var(--border-h);background:var(--bg-el)}
.cr-cover{
  width:44px;height:60px;border-radius:7px;overflow:hidden;
  background:var(--bg-el);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.cr-cover-ph{
  width:100%;height:100%;
  background:repeating-linear-gradient(-45deg,#0d0d1a,#0d0d1a 4px,#111120 4px,#111120 8px);
  display:flex;align-items:center;justify-content:center;
}
.cr-body{flex:1;min-width:0}
.cr-name{font-family:var(--fh);font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
.cr-item:hover .cr-name{color:var(--cyan)}
.cr-ch{font-size:11px;color:var(--muted);margin-bottom:6px}
.cr-progress-track{height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.cr-progress-fill{height:100%;border-radius:2px;background:var(--cyan)}
.cr-pct{font-size:10px;color:var(--muted);margin-top:4px}
.cr-resume{
  flex-shrink:0;padding:6px 14px;border-radius:7px;
  background:var(--cyan-d);border:1px solid oklch(0.72 0.17 195/.2);
  color:var(--cyan);font-size:11px;font-weight:600;font-family:var(--fh);
  cursor:pointer;transition:background .15s;
}
.cr-resume:hover{background:oklch(0.72 0.17 195/.18)}
/* LIBRARY GRID */
.lib-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.lib-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.lib-grid{grid-template-columns:repeat(2,1fr)}}
.lib-card{border-radius:var(--r);overflow:hidden;background:var(--bg-card);border:1px solid var(--border);cursor:pointer;transition:transform .2s,border-color .2s}
.lib-card:hover{transform:translateY(-3px);border-color:oklch(0.72 0.17 195/.3)}
.lib-card-cover{aspect-ratio:3/4;background:var(--bg-el);display:flex;align-items:center;justify-content:center}
.lib-card-ph{
  width:100%;height:100%;
  background:repeating-linear-gradient(-45deg,#0d0d1a,#0d0d1a 5px,#111120 5px,#111120 10px);
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:9px;font-family:monospace;
  flex-direction:column;gap:4px;
}
.lib-card-body{padding:10px}
.lib-card-title{font-family:var(--fh);font-size:12px;font-weight:600;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:5px;transition:color .15s}
.lib-card:hover .lib-card-title{color:var(--cyan)}
.lib-card-ch{font-size:10px;color:var(--cyan)}
/* SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:16px}
.side-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);padding:18px}
.side-title{font-family:var(--fh);font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.side-bar{width:3px;height:14px;border-radius:2px;background:var(--cyan)}
/* VIP CARD */
.vip-card{
  background:linear-gradient(135deg,oklch(0.82 0.16 85/.1),oklch(0.7 0.18 60/.08));
  border:1px solid oklch(0.82 0.16 85/.25);border-radius:var(--rl);padding:20px;
}
.vip-card-title{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--amber);margin-bottom:4px;display:flex;align-items:center;gap:7px}
.vip-card-sub{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.vip-expires{
  font-size:11px;color:var(--dim);background:rgba(255,255,255,.05);
  border-radius:6px;padding:7px 10px;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;
}
.vip-expires b{color:var(--amber)}
.vip-renew{
  width:100%;padding:9px;border-radius:var(--r);
  background:linear-gradient(135deg,var(--amber),oklch(0.7 0.18 60));
  color:#07070e;font-size:13px;font-weight:700;font-family:var(--fh);
  border:none;cursor:pointer;transition:filter .15s;
}
.vip-renew:hover{filter:brightness(1.1)}
/* SETTINGS */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:13px;color:var(--text)}
.setting-sub{font-size:11px;color:var(--muted);margin-top:2px}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-track{
  position:absolute;inset:0;border-radius:11px;cursor:pointer;
  background:var(--bg-el);border:1px solid var(--border);transition:background .2s;
}
.toggle input:checked ~ .toggle-track{background:var(--cyan);border-color:var(--cyan)}
.toggle-thumb{
  position:absolute;top:3px;left:3px;
  width:14px;height:14px;border-radius:50%;
  background:#fff;transition:transform .2s;
  pointer-events:none;
}
.toggle input:checked ~ .toggle-track ~ .toggle-thumb{transform:translateX(18px)}
.danger-btn{
  width:100%;padding:9px;border-radius:var(--r);
  background:transparent;border:1px solid oklch(0.65 0.22 15/.3);
  color:var(--rose);font-size:13px;font-weight:600;font-family:var(--fh);
  cursor:pointer;transition:background .15s;margin-top:8px;
}
.danger-btn:hover{background:oklch(0.65 0.22 15/.08)}
@media(max-width:800px){
  .prof-content{grid-template-columns:1fr}
  .sidebar{display:none}
  .nav{display:none}
  .prof-hero-in{flex-direction:column;align-items:flex-start}
  .prof-avatar-wrap{margin-bottom:0}
}
</style>
</head>
<body>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

const CONTINUE = [
  {id:1,title:'Solo Leveling',ch:179,totalCh:179,pct:98},
  {id:2,title:'Tower of God',ch:580,totalCh:610,pct:95},
  {id:3,title:'The Beginning After the End',ch:140,totalCh:183,pct:76},
  {id:4,title:'Omniscient Reader',ch:80,totalCh:147,pct:54},
  {id:5,title:'Martial Peak',ch:1200,totalCh:3600,pct:33},
];

const FAVORITES = [
  {id:1,title:'Solo Leveling',ch:179},{id:2,title:'Tower of God',ch:610},
  {id:3,title:'TBATE',ch:183},{id:4,title:'Omniscient Reader',ch:147},
  {id:5,title:'Nano Machine',ch:168},{id:6,title:'Return of Mt. Hua',ch:140},
  {id:7,title:'Apotheosis',ch:1100},{id:8,title:'Martial Peak',ch:3600},
];

const BOOKMARKS = [
  {id:1,title:'Second Life Ranker',ch:157},{id:2,title:'Dungeon Master',ch:88},
  {id:3,title:'Duke Pendragon',ch:211},{id:4,title:'Nano Machine',ch:168},
];

function ArcMark(){
  return(
    <svg viewBox="0 0 48 48" width="22" height="22" fill="none">
      <path d="M8 28 C14 14 34 14 40 28" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
      <path d="M16 34 C20 30 28 30 32 34" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
      <circle cx="24" cy="12" r="3" fill="oklch(0.65 0.22 15)"/>
    </svg>
  );
}

function Toggle({checked,onChange}){
  return(
    <label className="toggle">
      <input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)}/>
      <div className="toggle-track"/>
      <div className="toggle-thumb"/>
    </label>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "isVip": true,
  "username": "StarReader_MN"
}/*EDITMODE-END*/;

function App(){
  const [tweaks,setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [tab,setTab] = useState('reading');
  const [dark,setDark] = useState(true);
  const [notif,setNotif] = useState(true);
  const [autoNext,setAutoNext] = useState(false);
  const navItems=['Нүүр','Жагсаалт','Leaderboard','Хүсэлт','Профайл'];
  const username = tweaks.username||'StarReader_MN';

  const tabs=[
    {id:'reading',label:'Унших явц'},
    {id:'favorites',label:'Дуртай'},
    {id:'bookmarks',label:'Хадгалсан'},
    {id:'settings',label:'Тохиргоо'},
  ];

  return(
    <div style={{minHeight:'100vh'}}>
      <header className="hdr">
        <div className="hdr-in">
          <a className="logo" href="Arc Read Homepage.html">
            <div className="logo-icon"><ArcMark/></div>
            <span className="logo-txt">ARC<span className="logo-dot">•</span>READ</span>
          </a>
          <nav className="nav">
            {navItems.map((n,i)=>(
              <a key={n} className={`nl${i===4?' act':''}`}>{n}</a>
            ))}
          </nav>
          <div className="hdr-r">
            <button className="btn-in">Гарах</button>
          </div>
        </div>
      </header>

      {/* PROFILE HERO */}
      <div className="prof-hero">
        <div className="prof-hero-in">
          <div className="prof-avatar-wrap">
            <div className="prof-avatar">{username[0].toUpperCase()}</div>
          </div>
          <div className="prof-info">
            <div className="prof-name-row">
              <span className="prof-name">{username}</span>
              {tweaks.isVip && <span className="vip-badge">⭐ VIP</span>}
            </div>
            <div className="prof-join">2024 оны 3-р сараас эхэлсэн</div>
            <div className="prof-stats">
              <div className="prof-stat"><div className="prof-stat-val">142</div><div className="prof-stat-lbl">Уншсан</div></div>
              <div className="prof-stat"><div className="prof-stat-val">8</div><div className="prof-stat-lbl">Дуртай</div></div>
              <div className="prof-stat"><div className="prof-stat-val">3,841</div><div className="prof-stat-lbl">Chapter</div></div>
              <div className="prof-stat"><div className="prof-stat-val">#4</div><div className="prof-stat-lbl">Rank</div></div>
            </div>
          </div>
        </div>

        <div className="prof-tabs">
          {tabs.map(t=>(
            <button key={t.id} className={`prof-tab${tab===t.id?' on':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
          ))}
        </div>
      </div>
      <hr className="tab-divider"/>

      {/* CONTENT */}
      <div className="prof-content">
        <div>
          {/* READING PROGRESS */}
          {tab==='reading' && (
            <>
              <div className="cr-title"><div className="cr-bar"/>Унших явц</div>
              <div className="cr-list">
                {CONTINUE.map(item=>(
                  <a key={item.id} className="cr-item" href="Arc Read Detail.html">
                    <div className="cr-cover">
                      <div className="cr-cover-ph">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" opacity="0.3"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                      </div>
                    </div>
                    <div className="cr-body">
                      <div className="cr-name">{item.title}</div>
                      <div className="cr-ch">Ch. {item.ch} / {item.totalCh}</div>
                      <div className="cr-progress-track">
                        <div className="cr-progress-fill" style={{width:`${item.pct}%`}}/>
                      </div>
                      <div className="cr-pct">{item.pct}% дууссан</div>
                    </div>
                    <button className="cr-resume" onClick={e=>e.preventDefault()}>Үргэлжлүүлэх</button>
                  </a>
                ))}
              </div>
            </>
          )}

          {/* FAVORITES */}
          {tab==='favorites' && (
            <>
              <div className="cr-title"><div className="cr-bar"/>Дуртай манхуа</div>
              <div className="lib-grid">
                {FAVORITES.map(m=>(
                  <div key={m.id} className="lib-card">
                    <div className="lib-card-cover">
                      <div className="lib-card-ph">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" opacity="0.2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                        <span style={{opacity:.3,fontSize:9}}>{m.title.slice(0,10)}</span>
                      </div>
                    </div>
                    <div className="lib-card-body">
                      <div className="lib-card-title">{m.title}</div>
                      <div className="lib-card-ch">Ch. {m.ch}</div>
                    </div>
                  </div>
                ))}
              </div>
            </>
          )}

          {/* BOOKMARKS */}
          {tab==='bookmarks' && (
            <>
              <div className="cr-title"><div className="cr-bar"/>Хадгалсан</div>
              <div className="lib-grid">
                {BOOKMARKS.map(m=>(
                  <div key={m.id} className="lib-card">
                    <div className="lib-card-cover">
                      <div className="lib-card-ph">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" opacity="0.2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                        <span style={{opacity:.3,fontSize:9}}>{m.title.slice(0,10)}</span>
                      </div>
                    </div>
                    <div className="lib-card-body">
                      <div className="lib-card-title">{m.title}</div>
                      <div className="lib-card-ch">Ch. {m.ch}</div>
                    </div>
                  </div>
                ))}
              </div>
            </>
          )}

          {/* SETTINGS */}
          {tab==='settings' && (
            <>
              <div className="cr-title"><div className="cr-bar"/>Тохиргоо</div>
              <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:'4px 18px',marginBottom:16}}>
                <div className="setting-row">
                  <div><div className="setting-label">Харанхуй горим</div><div className="setting-sub">Апп харанхуй дэвсгэрт харагдана</div></div>
                  <Toggle checked={dark} onChange={setDark}/>
                </div>
                <div className="setting-row">
                  <div><div className="setting-label">Мэдэгдэл</div><div className="setting-sub">Шинэ chapter гарахад мэдэгдэх</div></div>
                  <Toggle checked={notif} onChange={setNotif}/>
                </div>
                <div className="setting-row">
                  <div><div className="setting-label">Автомат дараагийн chapter</div><div className="setting-sub">Дуусахад автоматаар үргэлжлүүлэх</div></div>
                  <Toggle checked={autoNext} onChange={setAutoNext}/>
                </div>
              </div>
              <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:'4px 18px'}}>
                <div className="setting-row">
                  <div><div className="setting-label">Нэвтрэх мэдээлэл</div><div className="setting-sub">Имэйл, нэр, нууц үг өөрчлөх</div></div>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M9 18l6-6-6-6"/></svg>
                </div>
                <div className="setting-row">
                  <div><div className="setting-label">Нууц үг солих</div></div>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M9 18l6-6-6-6"/></svg>
                </div>
              </div>
              <button className="danger-btn">Аккаунтаас гарах</button>
            </>
          )}
        </div>

        {/* SIDEBAR */}
        <div className="sidebar">
          {tweaks.isVip && (
            <div className="vip-card">
              <div className="vip-card-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--amber)" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                VIP гишүүнчлэл
              </div>
              <div className="vip-card-sub">Бүх контентэд хязгааргүй хандах боломжтой</div>
              <div className="vip-expires">
                <span>Дуусах огноо</span>
                <b>2025/06/30</b>
              </div>
              <button className="vip-renew">Сунгах</button>
            </div>
          )}

          <div className="side-card">
            <div className="side-title"><div className="side-bar"/>Уншсан статистик</div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {[
                ['Нийт chapter','3,841'],
                ['Нийт манхуа','142'],
                ['Энэ 7 хоногт','48 chapter'],
                ['Дундаж/өдөр','6.9 chapter'],
                ['Дуртай жанр','Action'],
              ].map(([l,v])=>(
                <div key={l} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:12}}>
                  <span style={{color:'var(--muted)'}}>{l}</span>
                  <span style={{color:'var(--text)',fontWeight:600,fontFamily:'var(--fh)'}}>{v}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="side-card">
            <div className="side-title"><div className="side-bar"/>Сүүлд уншсан</div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {CONTINUE.slice(0,3).map(m=>(
                <div key={m.id} style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}}>
                  <div style={{width:36,height:48,borderRadius:6,background:'var(--bg-el)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" opacity="0.3"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:'var(--fh)',fontSize:12,fontWeight:600,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.title}</div>
                    <div style={{fontSize:11,color:'var(--cyan)'}}>Ch. {m.ch}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Profile"/>
        <TweakText label="Username" tweakKey="username"/>
        <TweakToggle label="VIP member" tweakKey="isVip"/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
