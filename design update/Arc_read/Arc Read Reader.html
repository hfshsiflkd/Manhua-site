<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ARC•READ — Solo Leveling Ch. 179</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070e;--bg-card:#0d0d1a;--bg-el:#111120;
  --border:rgba(255,255,255,0.07);--border-h:rgba(255,255,255,0.13);
  --text:#e4e4f0;--muted:#6b6b80;--dim:#9494a8;
  --cyan:oklch(0.72 0.17 195);--cyan-g:oklch(0.72 0.17 195/.2);--cyan-d:oklch(0.72 0.17 195/.1);
  --rose:oklch(0.65 0.22 15);--amber:oklch(0.82 0.16 85);
  --fh:'Space Grotesk',sans-serif;--fb:'DM Sans',sans-serif;
  --r:10px;
}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#1f1f35;border-radius:9px}

/* READER HEADER */
.rdr-hdr{
  position:sticky;top:0;z-index:100;
  background:rgba(7,7,14,.95);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:0 16px;height:52px;
  display:flex;align-items:center;gap:12px;
}
.rdr-back{
  width:34px;height:34px;flex-shrink:0;
  border-radius:9px;border:1px solid var(--border);
  background:transparent;color:var(--dim);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,color .15s;
}
.rdr-back:hover{border-color:var(--border-h);color:var(--text)}
.rdr-info{flex:1;min-width:0}
.rdr-manhua{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rdr-chapter{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.01em}
.rdr-nav{display:flex;align-items:center;gap:6px;flex-shrink:0}
.rdr-nav-btn{
  padding:5px 12px;border-radius:7px;
  border:1px solid var(--border);background:transparent;
  color:var(--dim);font-size:12px;font-weight:500;
  cursor:pointer;font-family:var(--fb);
  transition:border-color .15s,color .15s;display:flex;align-items:center;gap:5px;
}
.rdr-nav-btn:hover{border-color:var(--border-h);color:var(--text)}
.rdr-nav-btn:disabled{opacity:.3;cursor:default}
.rdr-ch-sel{
  padding:5px 10px;border-radius:7px;
  border:1px solid var(--border);background:var(--bg-el);
  color:var(--text);font-family:var(--fb);font-size:12px;
  cursor:pointer;outline:none;
}
/* PROGRESS BAR */
.progress-bar{
  position:fixed;top:52px;left:0;right:0;height:2px;
  background:rgba(255,255,255,.05);z-index:99;
}
.progress-fill{height:100%;background:var(--cyan);transition:width .2s;box-shadow:0 0 8px var(--cyan-g)}

/* READER BODY */
.rdr-body{max-width:840px;margin:0 auto;padding:16px 0 80px}

/* PAGE PLACEHOLDER */
.page-ph{
  width:100%;position:relative;overflow:hidden;
  background:var(--bg-card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--muted);font-family:monospace;font-size:11px;
  border-bottom:2px solid var(--bg);
  user-select:none;
}
.page-ph-label{opacity:.35;margin-top:8px}
.page-ph-inner{
  width:100%;
  background:repeating-linear-gradient(180deg,#0d0d1a 0px,#0d0d1a 1px,#0e0e1b 1px,#0e0e1b 40px);
}

/* BOTTOM NAV */
.btm-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(7,7,14,.95);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.btm-info{font-size:12px;color:var(--muted);text-align:center}
.btm-info b{color:var(--text)}
.btm-cta{
  padding:8px 20px;border-radius:var(--r);
  background:var(--cyan);color:#07070e;
  font-size:13px;font-weight:700;font-family:var(--fh);
  border:none;cursor:pointer;box-shadow:0 0 16px var(--cyan-g);
  transition:filter .15s;
}
.btm-cta:hover{filter:brightness(1.1)}

/* VIP GATE */
.vip-gate{
  position:fixed;inset:0;z-index:200;
  background:rgba(7,7,14,.92);backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.vip-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:20px;padding:36px 32px;
  max-width:420px;width:100%;text-align:center;
  box-shadow:0 24px 64px rgba(0,0,0,.7);
}
.vip-icon{
  width:64px;height:64px;border-radius:16px;
  background:linear-gradient(135deg,oklch(0.72 0.17 195/.2),oklch(0.65 0.22 15/.2));
  border:1px solid oklch(0.72 0.17 195/.3);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;
}
.vip-title{font-family:var(--fh);font-size:22px;font-weight:700;color:#fff;margin-bottom:8px}
.vip-sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:24px}
.vip-btn{
  width:100%;padding:12px;border-radius:var(--r);
  background:var(--cyan);color:#07070e;
  font-size:14px;font-weight:700;font-family:var(--fh);
  border:none;cursor:pointer;box-shadow:0 0 22px var(--cyan-g);
  margin-bottom:10px;transition:filter .15s;
}
.vip-btn:hover{filter:brightness(1.1)}
.vip-back-btn{
  width:100%;padding:10px;border-radius:var(--r);
  background:transparent;color:var(--dim);font-size:13px;
  border:1px solid var(--border);cursor:pointer;font-family:var(--fb);
  transition:border-color .15s,color .15s;
}
.vip-back-btn:hover{border-color:var(--border-h);color:var(--text)}
.vip-features{display:flex;justify-content:center;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.vip-feat{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:5px}
.vip-feat-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan)}

@media(max-width:600px){
  .rdr-nav .rdr-ch-sel{display:none}
  .rdr-body{padding:8px 0 70px}
}
</style>
</head>
<body>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

const CHAPTERS_LIST = Array.from({length:20},(_,i)=>({num:179-i,label:`Chapter ${179-i}`}));
const PAGES = Array.from({length:18},(_,i)=>({num:i+1,h:Math.floor(800+Math.random()*600)}));

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "isVip": true,
  "showGate": false
}/*EDITMODE-END*/;

function ArcMark(){
  return(
    <svg viewBox="0 0 48 48" width="18" height="18" fill="none">
      <path d="M8 28 C14 14 34 14 40 28" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
      <path d="M16 34 C20 30 28 30 32 34" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
      <circle cx="24" cy="12" r="3" fill="oklch(0.65 0.22 15)"/>
    </svg>
  );
}

function VipGate({onClose}){
  return(
    <div className="vip-gate">
      <div className="vip-card">
        <div className="vip-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="oklch(0.72 0.17 195)" strokeWidth="1.8">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        </div>
        <h2 className="vip-title">VIP эрх шаардлагатай</h2>
        <p className="vip-sub">Энэ chapter VIP гишүүнчлэлтэй хэрэглэгчдэд зориулагдсан. Бүх контентэд хязгааргүй хандах боломж.</p>
        <div className="vip-features">
          <div className="vip-feat"><div className="vip-feat-dot"/><span>Бүх chapter</span></div>
          <div className="vip-feat"><div className="vip-feat-dot"/><span>Хурдан шинэчлэл</span></div>
          <div className="vip-feat"><div className="vip-feat-dot"/><span>Зар байхгүй</span></div>
        </div>
        <button className="vip-btn">VIP болох →</button>
        <button className="vip-back-btn" onClick={onClose}>← Буцах</button>
      </div>
    </div>
  );
}

function App(){
  const [tweaks,setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [chNum,setChNum] = useState(179);
  const [scroll,setScroll] = useState(0);
  const [showGate,setShowGate] = useState(false);
  const bodyRef = useRef(null);

  // scroll progress
  useEffect(()=>{
    const onScroll=()=>{
      const el=document.documentElement;
      const pct=el.scrollTop/(el.scrollHeight-el.clientHeight)||0;
      setScroll(Math.min(1,pct));
    };
    window.addEventListener('scroll',onScroll,{passive:true});
    return()=>window.removeEventListener('scroll',onScroll);
  },[]);

  const currentIdx = CHAPTERS_LIST.findIndex(c=>c.num===chNum);
  const hasPrev = currentIdx<CHAPTERS_LIST.length-1;
  const hasNext = currentIdx>0;

  return(
    <div style={{minHeight:'100vh'}}>
      {/* HEADER */}
      <div className="rdr-hdr">
        <a href="Arc Read Detail.html"><button className="rdr-back">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button></a>
        <div className="rdr-info">
          <div className="rdr-manhua">Solo Leveling</div>
          <div className="rdr-chapter">Chapter {chNum} — The Monarch's Shadow</div>
        </div>
        <div className="rdr-nav">
          <button className="rdr-nav-btn" disabled={!hasPrev}
            onClick={()=>hasPrev&&setChNum(CHAPTERS_LIST[currentIdx+1].num)}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M15 18l-6-6 6-6"/></svg>
            Өмнөх
          </button>
          <select className="rdr-ch-sel" value={chNum} onChange={e=>setChNum(Number(e.target.value))}>
            {CHAPTERS_LIST.map(c=><option key={c.num} value={c.num}>{c.label}</option>)}
          </select>
          <button className="rdr-nav-btn" disabled={!hasNext}
            onClick={()=>hasNext&&setChNum(CHAPTERS_LIST[currentIdx-1].num)}>
            Дараах
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
      </div>

      {/* PROGRESS */}
      <div className="progress-bar">
        <div className="progress-fill" style={{width:`${scroll*100}%`}}/>
      </div>

      {/* PAGES */}
      <div className="rdr-body" ref={bodyRef}>
        {PAGES.map((pg,i)=>(
          <div key={pg.num} className="page-ph" style={{height:`${pg.h}px`}}>
            <div className="page-ph-inner" style={{height:'100%',width:'100%',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:8}}>
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" opacity="0.12"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
              <span className="page-ph-label">Page {pg.num} — manga panel</span>
            </div>
          </div>
        ))}
      </div>

      {/* BOTTOM NAV */}
      <div className="btm-nav">
        <button className="rdr-nav-btn" disabled={!hasPrev}
          onClick={()=>hasPrev&&setChNum(CHAPTERS_LIST[currentIdx+1].num)}
          style={{padding:'8px 16px'}}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M15 18l-6-6 6-6"/></svg>
          Ch. {hasPrev?CHAPTERS_LIST[currentIdx+1].num:'—'}
        </button>
        <div className="btm-info">
          <div>Ch. <b>{chNum}</b> · {Math.round(scroll*100)}% уншсан</div>
          <div style={{fontSize:10,marginTop:2}}>{Math.round(scroll*PAGES.length)}/{PAGES.length} хуудас</div>
        </div>
        <button className="rdr-nav-btn" disabled={!hasNext}
          onClick={()=>hasNext&&setChNum(CHAPTERS_LIST[currentIdx-1].num)}
          style={{padding:'8px 16px'}}>
          Ch. {hasNext?CHAPTERS_LIST[currentIdx-1].num:'—'}
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>

      {/* VIP GATE */}
      {showGate && <VipGate onClose={()=>setShowGate(false)}/>}

      <TweaksPanel>
        <TweakSection label="Reader"/>
        <TweakToggle label="Show VIP gate" tweakKey="showGate"/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
    <rect width="120" height="80" fill="#07070e"/>
    <rect width="120" height="13" fill="#0d0d1a"/>
    <rect x="8" y="3" width="8" height="7" rx="2" fill="#111120"/>
    <rect x="22" y="4" width="50" height="5" rx="2" fill="#1a1a2e"/>
    <rect x="80" y="3" width="15" height="7" rx="2" fill="#111120"/>
    <rect x="98" y="3" width="15" height="7" rx="2" fill="#111120"/>
    <rect x="20" y="17" width="80" height="18" rx="2" fill="#0d0d1a"/>
    <rect x="20" y="38" width="80" height="14" rx="2" fill="#0d0d1a"/>
    <rect x="20" y="55" width="80" height="18" rx="2" fill="#0d0d1a"/>
    <rect x="0" y="73" width="120" height="7" fill="#0d0d1a"/>
  </svg>
</template>
</body>
</html>
