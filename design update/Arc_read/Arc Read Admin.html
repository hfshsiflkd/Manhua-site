<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070e;--bg-card:#0d0d1a;--bg-el:#111120;--bg-sidebar:#09090f;
  --border:rgba(255,255,255,0.07);--border-h:rgba(255,255,255,0.12);
  --text:#e4e4f0;--muted:#6b6b80;--dim:#9494a8;
  --cyan:oklch(0.72 0.17 195);--cyan-g:oklch(0.72 0.17 195/.2);--cyan-d:oklch(0.72 0.17 195/.1);
  --rose:oklch(0.65 0.22 15);--amber:oklch(0.82 0.16 85);
  --green:oklch(0.72 0.17 155);--green-d:oklch(0.72 0.17 155/.1);
  --purple:oklch(0.65 0.2 290);--purple-d:oklch(0.65 0.2 290/.1);
  --fh:'Space Grotesk',sans-serif;--fb:'DM Sans',sans-serif;
  --r:10px;--rl:14px;
}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;overflow-x:hidden;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg-sidebar)}::-webkit-scrollbar-thumb{background:var(--bg-el);border-radius:9px}

/* SIDEBAR */
.sidebar{
  width:220px;flex-shrink:0;min-height:100vh;
  background:var(--bg-sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.logo-icon{width:30px;height:30px;border-radius:8px;background:var(--bg-el);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.logo-txt{font-family:var(--fh);font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.logo-dot{color:var(--rose)}
.admin-badge{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-top:1px}
.sidebar-nav{padding:12px 8px;flex:1;display:flex;flex-direction:column;gap:2px}
.nav-section-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 8px 4px;margin-top:6px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);
  font-size:13px;font-weight:500;color:var(--dim);cursor:pointer;
  transition:color .15s,background .15s;text-decoration:none;
}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav-item.act{color:var(--cyan);background:var(--cyan-d)}
.nav-item svg{flex-shrink:0;opacity:.7}
.nav-item.act svg{opacity:1}
.nav-count{margin-left:auto;font-size:10px;font-weight:700;background:var(--cyan-d);color:var(--cyan);padding:1px 6px;border-radius:4px}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border)}
.admin-user{display:flex;align-items:center;gap:10px}
.admin-avatar{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--amber),oklch(0.7 0.18 60));display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:12px;font-weight:700;color:#07070e;flex-shrink:0}
.admin-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.2}
.admin-role{font-size:10px;color:var(--muted)}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:52px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;background:rgba(7,7,14,.7);backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:50;
}
.topbar-title{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-date{font-size:12px;color:var(--muted)}
.topbar-btn{
  padding:5px 14px;border-radius:20px;
  border:1px solid var(--border);background:transparent;
  color:var(--text);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--fb);
  transition:border-color .15s;
}
.topbar-btn:hover{border-color:var(--border-h)}
.content{padding:24px;flex:1}
.page-hd{margin-bottom:24px}
.page-title{font-family:var(--fh);font-size:22px;font-weight:700;letter-spacing:-.025em;color:#fff;margin-bottom:3px}
.page-sub{font-size:13px;color:var(--muted)}

/* STATS CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:1000px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);
  padding:18px;display:flex;flex-direction:column;gap:10px;
  transition:border-color .2s;
}
.stat-card:hover{border-color:var(--border-h)}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.stat-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.stat-val{font-family:var(--fh);font-size:28px;font-weight:700;color:#fff;letter-spacing:-.03em;line-height:1}
.stat-change{font-size:11px;display:flex;align-items:center;gap:4px}
.stat-change.up{color:var(--green)}
.stat-change.neutral{color:var(--muted)}

/* QUICK LINKS */
.ql-title{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ql-bar{width:3px;height:16px;border-radius:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan-g)}
.ql-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
@media(max-width:900px){.ql-grid{grid-template-columns:repeat(2,1fr)}}
.ql-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);
  padding:16px;cursor:pointer;text-decoration:none;
  transition:border-color .15s,background .15s,transform .15s;
  display:flex;flex-direction:column;gap:8px;
}
.ql-card:hover{border-color:var(--border-h);background:var(--bg-el);transform:translateY(-2px)}
.ql-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.ql-name{font-family:var(--fh);font-size:13px;font-weight:700;color:var(--text)}
.ql-desc{font-size:11px;color:var(--muted)}

/* BOTTOM GRID */
.bottom-grid{display:grid;grid-template-columns:1fr 320px;gap:16px}
@media(max-width:900px){.bottom-grid{grid-template-columns:1fr}}

/* RECENT MANHUAS */
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.2)}
.panel-title{font-family:var(--fh);font-size:13px;font-weight:700;color:var(--text)}
.panel-action{font-size:11px;color:var(--cyan);cursor:pointer}
table{width:100%;border-collapse:collapse}
th{padding:9px 16px;text-align:left;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:rgba(0,0,0,.15);border-bottom:1px solid var(--border)}
td{padding:11px 16px;border-bottom:1px solid var(--border);font-size:12px}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.tbl-title{font-weight:600;color:var(--text);font-family:var(--fh)}
.tbl-sub{font-size:10px;color:var(--muted);margin-top:2px}
.status-pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.s-ongoing{background:rgba(16,185,129,.12);color:#6ee7b7;border:1px solid rgba(16,185,129,.2)}
.s-completed{background:rgba(59,130,246,.12);color:#93c5fd;border:1px solid rgba(59,130,246,.2)}
.s-hiatus{background:rgba(245,158,11,.12);color:#fcd34d;border:1px solid rgba(245,158,11,.2)}
.tbl-num{font-family:var(--fh);font-weight:600;color:var(--text)}
.row-act{display:flex;gap:4px}
.act-btn{padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:10px;cursor:pointer;font-family:var(--fb);transition:color .12s,border-color .12s}
.act-btn:hover{color:var(--text);border-color:var(--border-h)}

/* ACTIVITY FEED */
.feed{display:flex;flex-direction:column}
.feed-item{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.feed-item:last-child{border-bottom:none}
.feed-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.feed-body{flex:1;min-width:0}
.feed-text{font-size:12px;color:var(--text);line-height:1.4}
.feed-time{font-size:10px;color:var(--muted);margin-top:3px}
</style>
</head>

            </a>
          ))}
          <div className="nav-section-label">Систем</div>
          {NAV_ITEMS.slice(5).map(n=>(
            <a key={n.label} className={`nav-item${n.label===activeNav?' act':''}`} onClick={()=>setActiveNav(n.label)}>
              {n.icon}{n.label}
            </a>
          ))}
        </nav>

        <div className="sidebar-footer">
          <div className="admin-user">
            <div className="admin-avatar">A</div>
            <div>
              <div className="admin-name">{tweaks.adminName||'Админ'}</div>
              <div className="admin-role">Administrator</div>
            </div>
          </div>
        </div>
      </div>

      {/* MAIN */}
      <div className="main">
        <div className="topbar">
          <div className="topbar-title">{activeNav}</div>
          <div className="topbar-right">
            <span className="topbar-date">2025 оны 4-р сарын 28</span>
            <button className="topbar-btn">+ Манхуа нэмэх</button>
            <button className="topbar-btn" style={{borderColor:'oklch(0.82 0.16 85/.3)',color:'var(--amber)'}}>⭐ VIP шалгах</button>
          </div>
        </div>

        <div className="content">
          <div className="page-hd">
            <div className="page-title">Admin dashboard</div>
            <div className="page-sub">Системийн ерөнхий статистик, хурдан линк, сүүлийн манхуа.</div>
          </div>

          {/* STATS */}
          <div className="stats-grid">
            {STATS.map(s=>(
              <div key={s.label} className="stat-card">
                <div className="stat-top">
                  <span className="stat-label">{s.label}</span>
                  <div className="stat-icon" style={{background:s.bg,color:s.color}}>{s.icon}</div>
                </div>
                <div className="stat-val" style={{color:s.color}}>{s.val}</div>
                <div className={`stat-change${s.up?' up':' neutral'}`}>
                  {s.up && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="18 15 12 9 6 15"/></svg>}
                  {s.change}
                </div>
              </div>
            ))}
          </div>

          {/* QUICK LINKS */}
          <div className="ql-title"><div className="ql-bar"/>Хурдан линк</div>
          <div className="ql-grid">
            {QUICK_LINKS.map(q=>(
              <a key={q.name} className="ql-card">
                <div className="ql-icon" style={{background:q.bg,color:q.color}}>{q.icon}</div>
                <div className="ql-name">{q.name}</div>
                <div className="ql-desc">{q.desc}</div>
              </a>
            ))}
          </div>

          {/* BOTTOM */}
          <div className="bottom-grid">
            {/* MANHUAS TABLE */}
            <div className="panel">
              <div className="panel-hdr">
                <div className="panel-title">Сүүлийн манхуа</div>
                <span className="panel-action">Бүгдийг харах →</span>
              </div>
              <table>
                <thead>
                  <tr>
                    <th>Манхуа</th>
                    <th>Статус</th>
                    <th>Ch.</th>
                    <th>Үзэлт</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  {MANHUAS.map(m=>(
                    <tr key={m.id}>
                      <td>
                        <div className="tbl-title">{m.title}</div>
                        <div className="tbl-sub">{m.updated}</div>
                      </td>
                      <td><span className={`status-pill ${statusClass[m.status]}`}>{statusLabel[m.status]}</span></td>
                      <td><span className="tbl-num">{m.chapters}</span></td>
                      <td><span className="tbl-num">{m.views.toLocaleString()}</span></td>
                      <td>
                        <div className="row-act">
                          <button className="act-btn">Засах</button>
                          <button className="act-btn">Ch+</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* ACTIVITY */}
            <div className="panel">
              <div className="panel-hdr">
                <div className="panel-title">Сүүлийн үйл явдал</div>
                <span className="panel-action">Лог →</span>
              </div>
              <div className="feed">
                {ACTIVITY.map((a,i)=>(
                  <div key={i} className="feed-item">
                    <div className="feed-dot" style={{background:a.color}}/>
                    <div className="feed-body">
                      <div className="feed-text">{a.text}</div>
                      <div className="feed-time">{a.time}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Admin"/>
        <TweakText label="Admin name" tweakKey="adminName"/>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
