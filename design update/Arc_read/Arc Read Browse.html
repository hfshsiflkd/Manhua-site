<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ARC•READ — Жагсаалт</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070e;--bg-card:#0d0d1a;--bg-el:#111120;
  --border:rgba(255,255,255,0.07);--border-h:rgba(255,255,255,0.13);
  --text:#e4e4f0;--muted:#6b6b80;--dim:#9494a8;
  --cyan:oklch(0.72 0.17 195);--cyan-g:oklch(0.72 0.17 195/.18);--cyan-d:oklch(0.72 0.17 195/.1);
  --rose:oklch(0.65 0.22 15);--amber:oklch(0.82 0.16 85);
  --fh:'Space Grotesk',sans-serif;--fb:'DM Sans',sans-serif;
  --r:10px;--rl:14px;--mx:1280px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;line-height:1.6;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg-el);border-radius:9px}
img{display:block}
/* HEADER */
.hdr{position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);background:rgba(7,7,14,.9);backdrop-filter:blur(18px)}
.hdr-in{max-width:var(--mx);margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer}
.logo-icon{width:34px;height:34px;border-radius:9px;background:var(--bg-el);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.logo-txt{font-family:var(--fh);font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.logo-dot{color:var(--rose)}
.nav{display:flex;align-items:center;gap:2px}
.nl{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:500;color:var(--dim);text-decoration:none;cursor:pointer;transition:color .15s,background .15s}
.nl:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nl.act{color:var(--cyan);background:var(--cyan-d)}
.hdr-r{display:flex;align-items:center;gap:8px}
.btn-s{width:34px;height:34px;border-radius:9px;background:transparent;border:1px solid var(--border);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s}
.btn-s:hover{border-color:var(--border-h);color:var(--text)}
.btn-in{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb);transition:border-color .15s,color .15s}
.btn-in:hover{border-color:var(--cyan);color:var(--cyan)}
.btn-reg{padding:5px 14px;border-radius:20px;background:var(--cyan);color:#07070e;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:var(--fb);box-shadow:0 0 18px var(--cyan-g);transition:filter .15s}
.btn-reg:hover{filter:brightness(1.1)}
/* PAGE */
.page{max-width:var(--mx);margin:0 auto;padding:36px 24px 60px}
.page-hd{margin-bottom:28px}
.page-title{font-family:var(--fh);font-size:28px;font-weight:700;letter-spacing:-.03em;background:linear-gradient(90deg,oklch(0.72 0.17 195),oklch(0.72 0.17 240));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.page-sub{margin-top:4px;font-size:13px;color:var(--muted)}
/* FILTER BAR */
.fbar{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);padding:18px;margin-bottom:24px;display:flex;flex-direction:column;gap:14px}
.search-wrap{position:relative}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-in{width:100%;padding:10px 14px 10px 38px;background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:var(--fb);font-size:13px;outline:none;transition:border-color .15s}
.search-in::placeholder{color:var(--muted)}
.search-in:focus{border-color:oklch(0.72 0.17 195/.5)}
.filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--fb);transition:all .15s;white-space:nowrap}
.pill:hover{border-color:var(--border-h);color:var(--text)}
.pill.on{border-color:oklch(0.72 0.17 195/.5);background:var(--cyan-d);color:var(--cyan)}
.sel{padding:8px 12px;background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:var(--fb);font-size:12px;cursor:pointer;outline:none}
.filter-row-2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.result-count{font-size:12px;color:var(--muted)}
.result-count b{color:var(--text)}
.sort-wrap{display:flex;align-items:center;gap:6px}
.sort-lbl{font-size:12px;color:var(--muted)}
/* GRID */
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
@media(max-width:1100px){.grid5{grid-template-columns:repeat(4,1fr)}}
@media(max-width:800px){.grid5{grid-template-columns:repeat(3,1fr);gap:12px}}
@media(max-width:540px){.grid5{grid-template-columns:repeat(2,1fr);gap:10px}}
/* CARD */
.card{border-radius:var(--rl);overflow:hidden;background:var(--bg-card);border:1px solid var(--border);cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;text-decoration:none;display:block}
.card:hover{transform:translateY(-4px);border-color:oklch(0.72 0.17 195/.4);box-shadow:0 12px 32px rgba(0,0,0,.5),0 0 0 1px oklch(0.72 0.17 195/.15)}
.card-cover{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--bg-el)}
.card-cover-img{width:100%;height:100%;object-fit:cover;transition:transform .25s}
.card:hover .card-cover-img{transform:scale(1.04)}
.card-cover-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:repeating-linear-gradient(-45deg,#0d0d1a,#0d0d1a 5px,#111120 5px,#111120 10px);color:var(--muted);font-size:9px;font-family:monospace;text-align:center;padding:8px;gap:4px}
.card-cover-ph svg{opacity:.25}
.card-status{position:absolute;top:8px;right:8px;border-radius:5px;padding:2px 7px;font-size:9px;font-weight:700;letter-spacing:.04em}
.s-ongoing{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
.s-completed{background:rgba(59,130,246,.15);color:#93c5fd;border:1px solid rgba(59,130,246,.3)}
.s-hiatus{background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.3)}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,7,14,.85) 0%,transparent 50%);opacity:0;transition:opacity .2s}
.card:hover .card-overlay{opacity:1}
.card-body{padding:12px}
.card-title{font-family:var(--fh);font-size:13px;font-weight:600;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;margin-bottom:8px;transition:color .15s}
.card:hover .card-title{color:var(--cyan)}
.card-genres{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.card-genre{font-size:9px;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.06);color:var(--dim)}
.card-foot{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border)}
.card-rating{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--amber)}
.card-ch{font-size:11px;color:var(--cyan);font-weight:600}
/* PAGINATION */
.pag{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:36px}
.pag-btn{padding:8px 20px;border-radius:var(--r);background:var(--bg-card);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb);transition:border-color .15s,background .15s}
.pag-btn:hover:not(:disabled){border-color:oklch(0.72 0.17 195/.5);background:var(--bg-el)}
.pag-btn:disabled{opacity:.35;cursor:default}
.pag-info{font-size:13px;color:var(--muted);padding:0 8px}
.pag-info b{color:var(--text)}
/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px;text-align:center;border:1px solid var(--border);border-radius:var(--rl);background:var(--bg-card)}
.empty-title{font-family:var(--fh);font-size:17px;font-weight:600;color:var(--text);margin-bottom:8px}
.empty-sub{font-size:13px;color:var(--muted);max-width:300px}
.clr-btn{margin-top:20px;padding:8px 22px;border-radius:20px;background:var(--cyan);color:#07070e;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:var(--fb)}
@media(max-width:600px){.nav{display:none}.page{padding:20px 16px 40px}.page-title{font-size:22px}}
</style>
</head>
<body>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect,useRef} = React;

const GENRES = ['Бүгд','Romance','Comedy','Drama','Action','Fantasy','Slice of Life','School','Isekai','Adventure','System','Mystery','Martial Arts'];
const STATUSES = ['Бүгд','Ongoing','Completed','Hiatus'];
const SORTS = [{v:'popular',l:'Trending'},{v:'rating',l:'Top Rated'},{v:'latest',l:'Latest'},{v:'az',l:'A–Z'}];

const RAW = [
  {id:1,title:'Solo Leveling',genres:['Action','Fantasy','System'],status:'ongoing',rating:9.2,ch:179,views:142800},
  {id:2,title:'Tower of God',genres:['Adventure','Mystery','Fantasy'],status:'ongoing',rating:8.8,ch:610,views:98400},
  {id:3,title:'The Beginning After the End',genres:['Isekai','Magic','Action'],status:'completed',rating:9.0,ch:183,views:87200},
  {id:4,title:'Martial Peak',genres:['Martial Arts','Action'],status:'ongoing',rating:8.2,ch:3600,views:76500},
  {id:5,title:'Apotheosis',genres:['Action','Fantasy'],status:'ongoing',rating:8.5,ch:1100,views:65300},
  {id:6,title:'Nano Machine',genres:['Action','System'],status:'ongoing',rating:8.7,ch:168,views:61200},
  {id:7,title:'Return of the Mount Hua Sect',genres:['Action','Comedy','Martial Arts'],status:'ongoing',rating:9.1,ch:140,views:58900},
  {id:8,title:'Omniscient Reader',genres:['Fantasy','Adventure'],status:'completed',rating:9.3,ch:147,views:55700},
  {id:9,title:'A Villain Is a Good Match for a Hero',genres:['Romance','Drama'],status:'ongoing',rating:8.4,ch:72,views:48300},
  {id:10,title:'Reincarnation of the Suicidal Battle God',genres:['Action','Fantasy'],status:'ongoing',rating:8.6,ch:98,views:44100},
  {id:11,title:'I Became a Renowned Family\'s Sword Prodigy',genres:['Action','Fantasy'],status:'hiatus',rating:8.0,ch:55,views:38700},
  {id:12,title:'Duke Pendragon',genres:['Fantasy','Action'],status:'completed',rating:8.3,ch:211,views:36400},
  {id:13,title:'Second Life Ranker',genres:['System','Action'],status:'ongoing',rating:8.9,ch:157,views:34200},
  {id:14,title:'The Dungeon Master',genres:['Fantasy','System'],status:'ongoing',rating:8.1,ch:88,views:29800},
  {id:15,title:'I\'m the Strongest',genres:['Comedy','Action'],status:'hiatus',rating:7.8,ch:44,views:25600},
  {id:16,title:'Tensei Shitara Slime Datta Ken',genres:['Isekai','Comedy','Fantasy'],status:'ongoing',rating:8.7,ch:112,views:24300},
  {id:17,title:'Lazy Dungeon Master',genres:['Comedy','Fantasy'],status:'completed',rating:7.9,ch:78,views:21500},
  {id:18,title:'Unordinary',genres:['Action','School'],status:'ongoing',rating:8.2,ch:300,views:19800},
  {id:19,title:'Lore Olympus',genres:['Romance','Drama'],status:'ongoing',rating:8.8,ch:240,views:18700},
  {id:20,title:'Age of Evolution',genres:['Action','System'],status:'ongoing',rating:8.3,ch:66,views:16400},
];

function CoverPH({title}){
  return(
    <div className="card-cover-ph">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <span style={{opacity:.45}}>{title?.slice(0,14)}</span>
    </div>
  );
}

function ArcMark(){
  return(
    <svg viewBox="0 0 48 48" width="22" height="22" fill="none">
      <path d="M8 28 C14 14 34 14 40 28" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
      <path d="M16 34 C20 30 28 30 32 34" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
      <circle cx="24" cy="12" r="3" fill="oklch(0.65 0.22 15)"/>
    </svg>
  );
}

function Header(){
  const navItems=['Нүүр','Жагсаалт','Leaderboard','Хүсэлт','Профайл'];
  return(
    <header className="hdr">
      <div className="hdr-in">
        <a className="logo" href="Arc Read Homepage.html">
          <div className="logo-icon"><ArcMark/></div>
          <span className="logo-txt">ARC<span className="logo-dot">•</span>READ</span>
        </a>
        <nav className="nav">
          {navItems.map((n,i)=>(
            <a key={n} className={`nl${i===1?' act':''}`}>{n}</a>
          ))}
        </nav>
        <div className="hdr-r">
          <button className="btn-s">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
          </button>
          <button className="btn-in">Нэвтрэх</button>
          <button className="btn-reg">Бүртгүүлэх</button>
        </div>
      </div>
    </header>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "cardStyle": "grid",
  "accentColor": "oklch(0.72 0.17 195)"
}/*EDITMODE-END*/;

function App(){
  const [tweaks,setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [search,setSearch] = useState('');
  const [genre,setGenre] = useState('Бүгд');
  const [status,setStatus] = useState('Бүгд');
  const [sort,setSort] = useState('popular');
  const [page,setPage] = useState(1);
  const PER = 12;

  const filtered = useMemo(()=>{
    let d = [...RAW];
    if(search.trim()) d = d.filter(m=>m.title.toLowerCase().includes(search.toLowerCase()));
    if(genre!=='Бүгд') d = d.filter(m=>m.genres.includes(genre));
    if(status!=='Бүгд') d = d.filter(m=>m.status.toLowerCase()===status.toLowerCase());
    if(sort==='rating') d.sort((a,b)=>b.rating-a.rating);
    else if(sort==='latest') d.sort((a,b)=>b.ch-a.ch);
    else if(sort==='az') d.sort((a,b)=>a.title.localeCompare(b.title));
    else d.sort((a,b)=>b.views-a.views);
    return d;
  },[search,genre,status,sort]);

  const totalPages = Math.max(1,Math.ceil(filtered.length/PER));
  const items = filtered.slice((page-1)*PER, page*PER);
  const hasFilters = search||genre!=='Бүгд'||status!=='Бүгд';

  useEffect(()=>setPage(1),[search,genre,status,sort]);

  const statusClass = s=>{
    const m={ongoing:'s-ongoing',completed:'s-completed',hiatus:'s-hiatus'};
    return m[s.toLowerCase()]||'s-ongoing';
  };
  const statusLabel = s=>({ongoing:'Ongoing',completed:'Completed',hiatus:'Hiatus'})[s.toLowerCase()]||s;

  return(
    <div style={{minHeight:'100vh'}}>
      <Header/>
      <div className="page">
        <div className="page-hd">
          <h1 className="page-title">Манхуа жагсаалт</h1>
          <p className="page-sub">Нэрээр хайх · жанраар шүүх · статус · дараалал</p>
        </div>

        {/* FILTER BAR */}
        <div className="fbar">
          <div className="search-wrap">
            <span className="search-ico">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
            </span>
            <input className="search-in" placeholder="Хайх..." value={search} onChange={e=>{setSearch(e.target.value);setPage(1)}}/>
          </div>

          <div className="filter-row">
            <span className="filter-label">Жанр</span>
            <div className="pills">
              {GENRES.map(g=>(
                <button key={g} className={`pill${genre===g?' on':''}`} onClick={()=>setGenre(g)}>{g}</button>
              ))}
            </div>
          </div>

          <div className="filter-row" style={{justifyContent:'space-between'}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span className="filter-label">Статус</span>
              <div className="pills">
                {STATUSES.map(s=>(
                  <button key={s} className={`pill${status===s?' on':''}`} onClick={()=>setStatus(s)}>{s}</button>
                ))}
              </div>
            </div>
            <div className="sort-wrap">
              <span className="sort-lbl">Дараалал</span>
              <select className="sel" value={sort} onChange={e=>setSort(e.target.value)}>
                {SORTS.map(s=><option key={s.v} value={s.v}>{s.l}</option>)}
              </select>
            </div>
          </div>
        </div>

        {/* RESULTS INFO */}
        <div className="filter-row-2" style={{marginBottom:16}}>
          <span className="result-count">
            Нийт <b>{filtered.length}</b> манхуа · хуудас <b>{page}</b>/{totalPages}
          </span>
          {hasFilters && (
            <button className="pill" style={{fontSize:11}} onClick={()=>{setSearch('');setGenre('Бүгд');setStatus('Бүгд')}}>
              ✕ Цэвэрлэх
            </button>
          )}
        </div>

        {/* GRID */}
        {items.length===0 ? (
          <div className="empty">
            <div className="empty-title">Тохирох манхуа олдсонгүй</div>
            <div className="empty-sub">Filter-ээ арилгаад дахин хайна уу.</div>
            <button className="clr-btn" onClick={()=>{setSearch('');setGenre('Бүгд');setStatus('Бүгд')}}>Filter цэвэрлэх</button>
          </div>
        ):(
          <div className="grid5">
            {items.map(m=>(
              <a key={m.id} className="card" href="Arc Read Detail.html">
                <div className="card-cover">
                  <CoverPH title={m.title}/>
                  <div className="card-overlay"/>
                  <span className={`card-status ${statusClass(m.status)}`}>{statusLabel(m.status)}</span>
                </div>
                <div className="card-body">
                  <div className="card-title">{m.title}</div>
                  <div className="card-genres">
                    {m.genres.slice(0,2).map(g=><span key={g} className="card-genre">{g}</span>)}
                    {m.genres.length>2 && <span className="card-genre">+{m.genres.length-2}</span>}
                  </div>
                  <div className="card-foot">
                    <div className="card-rating">
                      <svg width="10" height="10" viewBox="0 0 20 20" fill="oklch(0.82 0.16 85)"><polygon points="10,1 12.9,7 19.5,7.6 14.5,12 16.2,18.5 10,15 3.8,18.5 5.5,12 0.5,7.6 7.1,7"/></svg>
                      {m.rating.toFixed(1)}
                    </div>
                    <span className="card-ch">Ch. {m.ch}</span>
                  </div>
                </div>
              </a>
            ))}
          </div>
        )}

        {/* PAGINATION */}
        {totalPages>1 && (
          <div className="pag">
            <button className="pag-btn" disabled={page<=1} onClick={()=>setPage(p=>p-1)}>← Өмнөх</button>
            {[...Array(Math.min(5,totalPages))].map((_,i)=>{
              const pg = Math.max(1,Math.min(page-2,totalPages-4))+i;
              return(
                <button key={pg} className="pag-btn"
                  style={pg===page?{background:'var(--cyan-d)',borderColor:'oklch(0.72 0.17 195/.5)',color:'var(--cyan)'}:{}}
                  onClick={()=>setPage(pg)}>{pg}</button>
              );
            })}
            <button className="pag-btn" disabled={page>=totalPages} onClick={()=>setPage(p=>p+1)}>Дараах →</button>
          </div>
        )}
      </div>

      <TweaksPanel>
        <TweakSection label="Accent"/>
        <TweakColor label="Accent color" tweakKey="accentColor"/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
