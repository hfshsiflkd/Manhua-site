<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #07070e;
    --bg-card: #0d0d1a;
    --bg-elevated: #111120;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.14);
    --text: #e4e4f0;
    --text-muted: #6b6b80;
    --text-dim: #9494a8;
    --cyan: oklch(0.72 0.17 195);
    --cyan-glow: oklch(0.72 0.17 195 / 0.18);
    --cyan-dim: oklch(0.72 0.17 195 / 0.12);
    --rose: oklch(0.65 0.22 15);
    --rose-glow: oklch(0.65 0.22 15 / 0.2);
    --amber: oklch(0.82 0.16 85);
    --font-head: 'Space Grotesk', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --radius: 10px;
    --radius-lg: 14px;
    --max-w: 1280px;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.6;
    overflow-x: hidden;
    /* subtle noise */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 9px; }

  /* HEADER */
  .header {
    position: sticky; top: 0; z-index: 100;
    border-bottom: 1px solid var(--border);
    background: rgba(7,7,14,0.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  .header-inner {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: space-between;
  }

  /* LOGO */
  .logo { display:flex; align-items:center; gap:10px; text-decoration:none; flex-shrink:0; }
  .logo-icon {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    display: flex; align-items:center; justify-content:center;
    position: relative;
  }
  .logo-icon::before {
    content:''; position:absolute; inset:-1px;
    border-radius:10px;
    background: var(--rose-glow);
    filter: blur(6px);
    z-index:-1;
  }
  .logo-text {
    font-family: var(--font-head);
    font-size: 17px; font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .logo-dot { color: var(--rose); }

  /* NAV */
  .nav { display:flex; align-items:center; gap:2px; }
  .nav-link {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 13px; font-weight:500;
    color: var(--text-dim);
    text-decoration:none;
    transition: color 0.15s, background 0.15s;
    cursor:pointer;
  }
  .nav-link:hover { color:var(--text); background: rgba(255,255,255,0.05); }
  .nav-link.active { color: var(--cyan); background: var(--cyan-dim); }

  /* HEADER RIGHT */
  .header-right { display:flex; align-items:center; gap:8px; }
  .btn-search {
    width:34px; height:34px; border-radius:9px;
    background:transparent; border:1px solid var(--border);
    color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-search:hover { border-color: var(--border-hover); color:var(--text); }
  .btn-login {
    padding: 5px 14px; border-radius:20px;
    border: 1px solid var(--border);
    background: transparent; color:var(--text);
    font-size:13px; font-weight:500; cursor:pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-login:hover { border-color:var(--cyan); color:var(--cyan); }
  .btn-register {
    padding: 5px 14px; border-radius:20px;
    background: var(--cyan); color: #07070e;
    font-size:13px; font-weight:600; cursor:pointer;
    border:none;
    transition: filter 0.15s;
    box-shadow: 0 0 18px var(--cyan-glow);
  }
  .btn-register:hover { filter:brightness(1.1); }

  /* HERO */
  .hero-wrap { position:relative; width:100%; overflow:hidden; }
  .hero-slide {
    position:relative; width:100%;
    height: clamp(280px, 38vw, 460px);
    overflow:hidden;
    display:flex;
  }
  .hero-bg {
    position:absolute; inset:0;
    background-size:cover; background-position:center top;
    transition: opacity 0.6s ease;
  }
  .hero-bg-overlay {
    position:absolute; inset:0;
    background: linear-gradient(
      105deg,
      rgba(7,7,14,0.97) 0%,
      rgba(7,7,14,0.82) 45%,
      rgba(7,7,14,0.3) 75%,
      rgba(7,7,14,0.1) 100%
    );
  }
  .hero-content {
    position:relative; z-index:2;
    flex:1; display:flex; flex-direction:column;
    justify-content:center;
    padding: 40px 48px;
    max-width: 660px;
    gap: 18px;
  }
  .hero-meta { display:flex; align-items:center; gap:10px; }
  .hero-rating {
    display:flex; align-items:center; gap:5px;
    background: rgba(250,204,21,0.12);
    border: 1px solid rgba(250,204,21,0.2);
    border-radius:6px; padding:3px 8px;
    font-size:12px; font-weight:600;
    color: var(--amber);
  }
  .hero-status {
    font-size:11px; font-weight:600; letter-spacing:0.08em;
    text-transform:uppercase;
    padding:3px 9px; border-radius:5px;
    background: var(--cyan-dim); color:var(--cyan);
    border: 1px solid rgba(6,182,212,0.2);
  }
  .hero-title {
    font-family: var(--font-head);
    font-size: clamp(24px, 3.5vw, 40px);
    font-weight:700; line-height:1.15;
    letter-spacing:-0.025em;
    color: #fff;
    text-wrap: pretty;
  }
  .hero-genres { display:flex; flex-wrap:wrap; gap:6px; }
  .hero-genre-pill {
    font-size:11px; font-weight:500;
    padding:3px 9px; border-radius:20px;
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .hero-desc {
    font-size:13px; color:var(--text-dim);
    line-height:1.65; max-width:480px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
    overflow:hidden; text-wrap:pretty;
  }
  .hero-actions { display:flex; align-items:center; gap:10px; }
  .hero-cta {
    padding: 10px 22px; border-radius:9px;
    background: var(--cyan); color:#07070e;
    font-size:13px; font-weight:700; font-family:var(--font-head);
    border:none; cursor:pointer; letter-spacing:-0.01em;
    box-shadow: 0 0 22px var(--cyan-glow);
    transition: filter 0.15s, transform 0.1s;
    display:flex; align-items:center; gap:7px;
  }
  .hero-cta:hover { filter:brightness(1.1); transform:translateY(-1px); }
  .hero-more {
    padding: 10px 18px; border-radius:9px;
    background: transparent; color:var(--text-dim);
    font-size:13px; font-weight:500;
    border: 1px solid var(--border); cursor:pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .hero-more:hover { border-color:var(--border-hover); color:var(--text); }

  /* HERO COVER (right side) */
  .hero-cover-wrap {
    position:absolute; right:0; top:0; bottom:0;
    width: clamp(160px, 28%, 320px);
    display:flex; align-items:center; justify-content:flex-end;
    padding: 24px 40px 24px 0;
    z-index:2;
  }
  .hero-cover-img {
    height:100%; max-height:380px;
    width:auto; object-fit:cover;
    border-radius:var(--radius-lg);
    box-shadow: -20px 0 60px rgba(7,7,14,0.8), 0 8px 32px rgba(0,0,0,0.6);
  }

  /* HERO DOTS */
  .hero-dots {
    display:flex; justify-content:center; gap:6px;
    padding: 14px 0 6px;
  }
  .hero-dot {
    border:none; cursor:pointer; padding:0;
    border-radius:9px; transition: width 0.3s, background 0.3s;
    height:4px;
    background: rgba(255,255,255,0.18);
    width: 20px;
  }
  .hero-dot.active { background:var(--cyan); width:32px; }

  /* SECTION */
  .section { padding: 32px 0; }
  .section-inner { max-width:var(--max-w); margin:0 auto; padding:0 24px; }
  .section-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 20px;
  }
  .section-title-wrap { display:flex; align-items:center; gap:10px; }
  .section-bar {
    width:3px; height:20px; border-radius:2px;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan-glow);
  }
  .section-title {
    font-family:var(--font-head);
    font-size:17px; font-weight:700;
    letter-spacing:-0.02em; color:#fff;
  }
  .section-see-all {
    font-size:12px; font-weight:500; color:var(--text-muted);
    text-decoration:none; cursor:pointer;
    transition: color 0.15s;
    display:flex; align-items:center; gap:4px;
  }
  .section-see-all:hover { color:var(--cyan); }

  /* POPULAR GRID */
  .popular-grid {
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
  }
  @media(max-width:900px) {
    .popular-grid { grid-template-columns:repeat(3,1fr); }
    .popular-card:nth-child(n+4) { display:none; }
  }
  @media(max-width:540px) {
    .popular-grid { grid-template-columns:repeat(2,1fr); gap:10px; }
    .popular-card:nth-child(n+5) { display:none; }
  }

  .popular-card {
    display:flex; flex-direction:column;
    cursor:pointer; text-decoration:none;
    transition: transform 0.2s;
  }
  .popular-card:hover { transform:translateY(-3px); }
  .popular-cover-wrap {
    position:relative; width:100%;
    aspect-ratio: 3/4;
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--bg-elevated);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .popular-cover {
    width:100%; height:100%; object-fit:cover;
    transition:transform 0.25s;
  }
  .popular-card:hover .popular-cover { transform:scale(1.04); }
  .popular-rank {
    position:absolute; top:8px; left:8px;
    font-family:var(--font-head);
    font-size:20px; font-weight:700;
    color:#fff; line-height:1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    letter-spacing:-0.04em;
    opacity:0.85;
  }
  .popular-rank.top3 { color:var(--amber); opacity:1; }
  .popular-views {
    position:absolute; top:7px; right:7px;
    background: rgba(6,182,212,0.85);
    backdrop-filter:blur(4px);
    border-radius:5px; padding:2px 6px;
    font-size:10px; font-weight:700; color:#07070e;
  }
  .popular-meta { margin-top:10px; display:flex; flex-direction:column; gap:4px; }
  .popular-title {
    font-size:13px; font-weight:600; color:var(--text);
    line-clamp:2; -webkit-line-clamp:2; display:-webkit-box;
    -webkit-box-orient:vertical; overflow:hidden;
    transition: color 0.15s;
    font-family:var(--font-head);
    line-height:1.3;
  }
  .popular-card:hover .popular-title { color:var(--cyan); }
  .popular-bottom { display:flex; align-items:center; justify-content:space-between; }
  .popular-rating { display:flex; align-items:center; gap:3px; font-size:11px; color:var(--amber); }
  .popular-chapter { font-size:11px; color:var(--text-muted); }
  .popular-time { font-size:10px; color:var(--text-muted); }

  /* COVER PLACEHOLDER (striped) */
  .cover-placeholder {
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: repeating-linear-gradient(
      -45deg,
      var(--bg-elevated),
      var(--bg-elevated) 6px,
      var(--bg-card) 6px,
      var(--bg-card) 12px
    );
    color:var(--text-muted); font-size:10px; font-family:monospace;
    text-align:center; padding:8px; gap:6px;
  }
  .cover-placeholder svg { opacity:0.3; }

  /* LATEST UPDATES */
  .latest-grid {
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
  }
  @media(max-width:680px) { .latest-grid { grid-template-columns:1fr; } }

  .latest-item {
    display:flex; gap:12px; padding:14px 0;
    border-bottom:1px solid var(--border);
    cursor:pointer; text-decoration:none;
    transition: background 0.15s;
    border-radius:var(--radius);
    padding: 12px;
    margin: 0 -12px;
  }
  .latest-item:hover { background:rgba(255,255,255,0.03); }

  .latest-cover {
    flex-shrink:0;
    width:50px; height:70px;
    border-radius:7px; overflow:hidden;
    background:var(--bg-elevated);
  }
  .latest-cover img { width:100%; height:100%; object-fit:cover; }
  .latest-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .latest-title {
    font-size:13px; font-weight:600; color:var(--text);
    line-clamp:2; -webkit-line-clamp:2; display:-webkit-box;
    -webkit-box-orient:vertical; overflow:hidden; line-height:1.35;
    font-family:var(--font-head);
    transition: color 0.15s;
  }
  .latest-item:hover .latest-title { color:var(--cyan); }
  .latest-chapters { display:flex; flex-direction:column; gap:4px; }
  .latest-ch {
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--text-dim);
    transition:color 0.12s;
  }
  .latest-ch:hover { color:var(--text); }
  .latest-ch-dot {
    width:5px; height:5px; border-radius:50%; flex-shrink:0;
    background: var(--rose);
  }
  .latest-ch-dot.read { background:var(--text-muted); opacity:0.4; }
  .latest-ch-label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge-new {
    background:var(--rose); color:#fff;
    font-size:9px; font-weight:700; letter-spacing:0.05em;
    padding:1px 5px; border-radius:3px; flex-shrink:0;
  }
  .latest-ch-time { margin-left:auto; font-size:10px; color:var(--text-muted); flex-shrink:0; }

  /* FOOTER */
  .footer {
    margin-top:48px;
    border-top:1px solid var(--border);
    padding:28px 24px;
    text-align:center;
    color:var(--text-muted); font-size:12px;
  }
  .footer-logo {
    font-family:var(--font-head); font-weight:700; font-size:15px;
    color:var(--text); margin-bottom:8px;
  }

  /* UTILITY */
  .divider { height:1px; background:var(--border); margin:0; }
  img { display:block; }

  @media(max-width:640px) {
    .hero-cover-wrap { display:none; }
    .hero-content { padding:28px 20px; max-width:100%; }
    .nav { display:none; }
    .section-inner { padding:0 16px; }
  }
</style>
</head>

    <div style={{

        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <span style={{opacity:0.5}}>{title?.slice(0,12)}</span>
      <span style={{opacity:0.3}}>cover art</span>
    </div>
  );
}

function StarRow({ rating }) {
  const r = Math.min(5, Math.max(0, rating || 0));
  const full = Math.floor(r);
  const half = r % 1 >= 0.5;
  const empty = Math.max(0, 5 - full - (half ? 1 : 0));
  return (
    <div style={{display:'flex', alignItems:'center', gap:'2px'}}>
      {[...Array(full)].map((_,i) => <span key={i} style={{color:'oklch(0.82 0.16 85)',fontSize:'10px'}}>★</span>)}
      {half && <span style={{color:'oklch(0.82 0.16 85)',fontSize:'10px'}}>½</span>}
      {[...Array(empty)].map((_,i) => <span key={i} style={{color:'rgba(255,255,255,0.15)',fontSize:'10px'}}>★</span>)}
      <span style={{marginLeft:'3px', fontSize:'10px', color:'#9494a8'}}>{rating.toFixed(1)}</span>
    </div>
  );
}

/* HERO */
function Hero({ accentColor }) {
  const [idx, setIdx] = useState(0);
  const timerRef = useRef(null);
  const slide = HERO_SLIDES[idx];

  useEffect(() => {
    timerRef.current = setInterval(() => setIdx(i => (i+1) % HERO_SLIDES.length), 4000);
    return () => clearInterval(timerRef.current);
  }, []);

  const go = (i) => {
    clearInterval(timerRef.current);
    setIdx(i);
    timerRef.current = setInterval(() => setIdx(j => (j+1) % HERO_SLIDES.length), 4000);
  };

  const bgStyle = {
    background: `linear-gradient(105deg, ${slide.color} 0%, rgba(7,7,14,0.3) 100%)`,
  };

  return (
    <div className="hero-wrap">
      <div className="hero-slide" style={bgStyle}>
        {/* BG overlay */}
        <div style={{
          position:'absolute', inset:0,
          background:`linear-gradient(105deg, rgba(7,7,14,0.98) 0%, rgba(7,7,14,0.75) 50%, rgba(7,7,14,0.15) 100%)`
        }}/>
        {/* subtle grid lines */}
        <div style={{
          position:'absolute', inset:0, opacity:0.04,
          backgroundImage:'linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px)',
          backgroundSize:'40px 40px',
        }}/>

        <div className="hero-content" style={{maxWidth:'var(--max-w)', margin:'0 auto', width:'100%', position:'relative', zIndex:2}}>
          {/* META ROW */}
          <div className="hero-meta">
            <div className="hero-rating">
              <svg width="11" height="11" viewBox="0 0 20 20" fill="oklch(0.82 0.16 85)">
                <polygon points="10,1 12.9,7 19.5,7.6 14.5,12 16.2,18.5 10,15 3.8,18.5 5.5,12 0.5,7.6 7.1,7"/>
              </svg>
              {slide.rating}
            </div>
            <div className="hero-status">{slide.status}</div>
          </div>

          {/* TITLE */}
          <h1 className="hero-title">{slide.title}</h1>

          {/* GENRES */}
          <div className="hero-genres">
            {slide.genres.map(g => <span key={g} className="hero-genre-pill">{g}</span>)}
          </div>

          {/* DESC */}
          <p className="hero-desc">{slide.desc}</p>

          {/* ACTIONS */}
          <div className="hero-actions">
            <button className="hero-cta" style={{background: accentColor, boxShadow:`0 0 22px ${accentColor}30`}}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
              </svg>
              Унших
            </button>
            <button className="hero-more">Дэлгэрэнгүй →</button>
          </div>
        </div>

        {/* COVER */}
        <div className="hero-cover-wrap" style={{zIndex:2}}>
          <div style={{
            height:'clamp(180px, 30vw, 360px)',
            aspectRatio:'2/3',
            borderRadius:'14px',
            overflow:'hidden',
            boxShadow:'-20px 0 60px rgba(7,7,14,0.9), 0 8px 32px rgba(0,0,0,0.6)',
          }}>
            <CoverPlaceholder title={slide.title} />
          </div>
        </div>
      </div>

      {/* DOTS */}
      <div className="hero-dots">
        {HERO_SLIDES.map((_,i) => (
          <button
            key={i} className={`hero-dot${i===idx?' active':''}`}
            style={i===idx ? {background: accentColor} : {}}
            onClick={() => go(i)}
          />
        ))}
      </div>
    </div>
  );
}
