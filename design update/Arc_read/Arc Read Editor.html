<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ARC•READ — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070e;--bg-card:#0d0d1a;--bg-el:#111120;--bg-sidebar:#09090f;
  --border:rgba(255,255,255,0.07);--border-h:rgba(255,255,255,0.12);
  --text:#e4e4f0;--muted:#6b6b80;--dim:#9494a8;
  --cyan:oklch(0.72 0.17 195);--cyan-g:oklch(0.72 0.17 195/.2);--cyan-d:oklch(0.72 0.17 195/.1);
  --green:oklch(0.72 0.17 155);--green-d:oklch(0.72 0.17 155/.1);--green-g:oklch(0.72 0.17 155/.2);
  --rose:oklch(0.65 0.22 15);--amber:oklch(0.82 0.16 85);
  --purple:oklch(0.65 0.2 290);--purple-d:oklch(0.65 0.2 290/.1);
  --fh:'Space Grotesk',sans-serif;--fb:'DM Sans',sans-serif;
  --r:10px;--rl:14px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg-sidebar)}::-webkit-scrollbar-thumb{background:var(--bg-el);border-radius:9px}
#root{display:flex;min-height:100vh;width:100%}

/* SIDEBAR */
.sidebar{width:210px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-logo{padding:16px 14px 12px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;cursor:pointer}
.logo-icon{width:30px;height:30px;border-radius:8px;background:var(--bg-el);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.logo-txt{font-family:var(--fh);font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.logo-dot{color:var(--rose)}
.editor-badge{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.sb-nav{padding:10px 8px;flex:1;display:flex;flex-direction:column;gap:2px}
.sb-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:7px 8px 3px;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);font-size:13px;font-weight:500;color:var(--dim);cursor:pointer;transition:color .15s,background .15s;text-decoration:none;border:none;background:transparent;width:100%;text-align:left}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav-item.act{color:var(--green);background:var(--green-d)}
.nav-item svg{flex-shrink:0;opacity:.7}
.nav-item.act svg{opacity:1}
.nav-ct{margin-left:auto;font-size:10px;font-weight:700;background:var(--green-d);color:var(--green);padding:1px 6px;border-radius:4px}
.sb-user{padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px}
.sb-avatar{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--green),oklch(0.72 0.17 195));display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:12px;font-weight:700;color:#07070e;flex-shrink:0}
.sb-name{font-size:12px;font-weight:600;color:var(--text)}
.sb-role{font-size:10px;color:var(--muted)}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(7,7,14,.7);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50}
.topbar-title{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--text)}
.topbar-r{display:flex;align-items:center;gap:8px}
.btn-add{padding:6px 16px;border-radius:20px;background:linear-gradient(90deg,var(--green),var(--cyan));color:#07070e;font-size:12px;font-weight:700;font-family:var(--fh);border:none;cursor:pointer;box-shadow:0 0 16px var(--green-g);transition:filter .15s}
.btn-add:hover{filter:brightness(1.1)}

/* CONTENT */
.content{padding:24px;flex:1}
.pg-hd{margin-bottom:22px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pg-title{font-family:var(--fh);font-size:20px;font-weight:700;letter-spacing:-.025em;color:#fff}
.pg-sub{font-size:12px;color:var(--muted);margin-top:3px}

/* SEARCH */
.search-row{display:flex;gap:10px;margin-bottom:20px}
.search-wrap{position:relative;flex:1}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-in{width:100%;padding:9px 14px 9px 36px;background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:var(--fb);font-size:13px;outline:none;transition:border-color .15s}
.search-in::placeholder{color:var(--muted)}
.search-in:focus{border-color:oklch(0.72 0.17 155/.5)}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--fb);transition:all .15s;white-space:nowrap}
.pill:hover{border-color:var(--border-h);color:var(--text)}
.pill.on{border-color:oklch(0.72 0.17 155/.5);background:var(--green-d);color:var(--green)}

/* TABLE */
.tbl-wrap{border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;background:var(--bg-card)}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:rgba(0,0,0,.25);border-bottom:1px solid var(--border)}
td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.cover-cell{display:flex;align-items:center;gap:12px}
.cover-thumb{width:40px;height:56px;border-radius:7px;overflow:hidden;background:var(--bg-el);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cover-ph{width:100%;height:100%;background:repeating-linear-gradient(-45deg,#0d0d1a,#0d0d1a 4px,#111120 4px,#111120 8px);display:flex;align-items:center;justify-content:center}
.m-title{font-family:var(--fh);font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.m-slug{font-size:10px;color:var(--muted);font-family:monospace}
.status-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700}
.s-ongoing{background:rgba(16,185,129,.12);color:#6ee7b7;border:1px solid rgba(16,185,129,.25)}
.s-completed{background:rgba(59,130,246,.12);color:#93c5fd;border:1px solid rgba(59,130,246,.25)}
.s-hiatus{background:rgba(245,158,11,.12);color:#fcd34d;border:1px solid rgba(245,158,11,.25)}
.status-dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.tbl-num{font-family:var(--fh);font-weight:600;color:var(--text)}
.genre-tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:9px;background:rgba(255,255,255,.06);color:var(--dim);margin:1px}
.act-row{display:flex;gap:5px;justify-content:flex-end}
.act-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:10px;font-weight:600;cursor:pointer;font-family:var(--fh);transition:all .12s;white-space:nowrap}
.act-btn:hover{color:var(--text);border-color:var(--border-h)}
.act-btn.edit{border-color:oklch(0.72 0.17 195/.4);color:var(--cyan);background:var(--cyan-d)}
.act-btn.edit:hover{background:oklch(0.72 0.17 195/.18)}
.act-btn.chapters{border-color:oklch(0.72 0.17 155/.4);color:var(--green);background:var(--green-d)}
.act-btn.chapters:hover{background:oklch(0.72 0.17 155/.18)}
.act-btn.cycle{border-color:oklch(0.65 0.2 290/.4);color:var(--purple);background:var(--purple-d)}
/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-sm{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;display:flex;align-items:center;gap:12px}
.stat-sm-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-sm-val{font-family:var(--fh);font-size:22px;font-weight:700;color:#fff;line-height:1}
.stat-sm-lbl{font-size:11px;color:var(--muted);margin-top:2px}
/* EMPTY */
.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty-icon{font-size:36px;margin-bottom:12px;opacity:.5}
/* FOOTER */
.tbl-foot{padding:10px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo} = React;

const MANHUAS = [
  {id:'1',title:'Solo Leveling',slug:'solo-leveling',status:'ongoing',chapters:179,views:142800,genres:['Action','Fantasy','System'],updated:'2025-04-28'},
  {id:'2',title:'Tower of God',slug:'tower-of-god',status:'ongoing',chapters:610,views:98400,genres:['Adventure','Mystery'],updated:'2025-04-26'},
  {id:'3',title:'The Beginning After the End',slug:'tbate',status:'completed',chapters:183,views:87200,genres:['Isekai','Action'],updated:'2025-04-20'},
  {id:'4',title:'Martial Peak',slug:'martial-peak',status:'ongoing',chapters:3600,views:76500,genres:['Martial Arts'],updated:'2025-04-25'},
  {id:'5',title:'Apotheosis',slug:'apotheosis',status:'hiatus',chapters:1100,views:65300,genres:['Action','Fantasy'],updated:'2025-04-01'},
  {id:'6',title:'Nano Machine',slug:'nano-machine',status:'ongoing',chapters:168,views:61200,genres:['Action','System'],updated:'2025-04-27'},
  {id:'7',title:'Return of Mt. Hua Sect',slug:'return-mt-hua',status:'ongoing',chapters:140,views:58900,genres:['Action','Comedy'],updated:'2025-04-23'},
];

const CYCLE = {ongoing:'hiatus',hiatus:'completed',completed:'ongoing'};
const CYCLE_LABEL = {ongoing:'→ Hiatus',hiatus:'→ Completed',completed:'→ Ongoing'};

const NAV = [
  {label:'My Manhuas',act:true,icon:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>,ct:'7'},
  {label:'Leaderboard',icon:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>},
  {label:'Teams',icon:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>},
];

function ArcMark(){
  return(
    <svg viewBox="0 0 48 48" width="18" height="18" fill="none">
      <path d="M8 28 C14 14 34 14 40 28" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
      <path d="M16 34 C20 30 28 30 32 34" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
      <circle cx="24" cy="12" r="3" fill="oklch(0.65 0.22 15)"/>
    </svg>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "editorName": "Orchilon_T",
  "role": "Editor"
}/*EDITMODE-END*/;

function App(){
  const [tweaks,setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [items,setItems] = useState(MANHUAS);
  const [search,setSearch] = useState('');
  const [statusFilter,setStatusFilter] = useState('all');
  const [activeNav,setActiveNav] = useState('My Manhuas');

  const statusClass={ongoing:'s-ongoing',completed:'s-completed',hiatus:'s-hiatus'};
  const statusLabel={ongoing:'Ongoing',completed:'Completed',hiatus:'Hiatus'};

  const filtered = useMemo(()=>{
    let d=[...items];
    if(search.trim()) d=d.filter(m=>m.title.toLowerCase().includes(search.toLowerCase())||m.slug.includes(search.toLowerCase()));
    if(statusFilter!=='all') d=d.filter(m=>m.status===statusFilter);
    return d;
  },[items,search,statusFilter]);

  const cycleStatus=(id)=>{
    setItems(prev=>prev.map(m=>m.id===id?{...m,status:CYCLE[m.status]}:m));
  };

  const stats=[
    {val:items.length,lbl:'Нийт манхуа',color:'var(--green)',bg:'var(--green-d)',icon:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>},
    {val:items.reduce((s,m)=>s+m.chapters,0).toLocaleString(),lbl:'Нийт chapter',color:'var(--cyan)',bg:'var(--cyan-d)',icon:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>},
    {val:items.filter(m=>m.status==='ongoing').length,lbl:'Ongoing',color:'var(--amber)',bg:'oklch(0.82 0.16 85/.1)',icon:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>},
  ];

  return(
    <>
      <div className="sidebar">
        <div className="sb-logo">
          <a className="logo" href="Arc Read Homepage.html">
            <div className="logo-icon"><ArcMark/></div>
            <div>
              <div className="logo-txt">ARC<span className="logo-dot">•</span>READ</div>
              <div className="editor-badge">Editor Panel</div>
            </div>
          </a>
        </div>
        <nav className="sb-nav">
          <div className="sb-label">Контент</div>
          {NAV.map(n=>(
            <button key={n.label} className={`nav-item${n.label===activeNav?' act':''}`} onClick={()=>setActiveNav(n.label)}>
              {n.icon}{n.label}
              {n.ct&&<span className="nav-ct">{n.ct}</span>}
            </button>
          ))}
          <div className="sb-label">Навигац</div>
          <a className="nav-item" href="Arc Read Homepage.html">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            Нүүр хуудас
          </a>
          <a className="nav-item" href="Arc Read Admin.html">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Admin panel
          </a>
        </nav>
        <div className="sb-user">
          <div className="sb-avatar">{(tweaks.editorName||'E')[0].toUpperCase()}</div>
          <div>
            <div className="sb-name">{tweaks.editorName||'Editor'}</div>
            <div className="sb-role">{tweaks.role||'Editor'}</div>
          </div>
        </div>
      </div>

      <div className="main">
        <div className="topbar">
          <div className="topbar-title">My Manhuas</div>
          <div className="topbar-r">
            <button className="btn-add">+ New Manhua</button>
          </div>
        </div>

        <div className="content">
          <div className="pg-hd">
            <div>
              <div className="pg-title">My Manhuas</div>
              <div className="pg-sub">Өөрийн нэмсэн манхуа жагсаалт — статус, chapter, нийтийн хуудсыг удирдана.</div>
            </div>
          </div>

          {/* STATS */}
          <div className="stats-row">
            {stats.map(s=>(
              <div key={s.lbl} className="stat-sm">
                <div className="stat-sm-icon" style={{background:s.bg,color:s.color}}>{s.icon}</div>
                <div>
                  <div className="stat-sm-val" style={{color:s.color}}>{s.val}</div>
                  <div className="stat-sm-lbl">{s.lbl}</div>
                </div>
              </div>
            ))}
          </div>

          {/* SEARCH + FILTERS */}
          <div className="search-row">
            <div className="search-wrap">
              <span className="search-ico">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
              </span>
              <input className="search-in" placeholder="Хайх (title, slug, genre)..." value={search} onChange={e=>setSearch(e.target.value)}/>
            </div>
          </div>
          <div className="filter-pills" style={{marginBottom:16}}>
            {['all','ongoing','completed','hiatus'].map(s=>(
              <button key={s} className={`pill${statusFilter===s?' on':''}`} onClick={()=>setStatusFilter(s)}>
                {s==='all'?'Бүгд':s==='ongoing'?'Ongoing':s==='completed'?'Completed':'Hiatus'}
              </button>
            ))}
          </div>

          {/* TABLE */}
          <div className="tbl-wrap">
            <table>
              <thead>
                <tr>
                  <th>Манхуа</th>
                  <th>Статус</th>
                  <th>Chapters</th>
                  <th>Жанр</th>
                  <th>Шинэчлэл</th>
                  <th style={{textAlign:'right'}}>Үйлдэл</th>
                </tr>
              </thead>
              <tbody>
                {filtered.length===0 ? (
                  <tr><td colSpan={6}>
                    <div className="empty">
                      <div className="empty-icon">📚</div>
                      {search?'Хайлтад тохирох манхуа олдсонгүй':'Манхуа алга'}
                    </div>
                  </td></tr>
                ) : filtered.map(m=>(
                  <tr key={m.id}>
                    <td>
                      <div className="cover-cell">
                        <div className="cover-thumb">
                          <div className="cover-ph">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" opacity="0.3"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                          </div>
                        </div>
                        <div>
                          <div className="m-title">{m.title}</div>
                          <div className="m-slug">/manhua/{m.slug}</div>
                        </div>
                      </div>
                    </td>
                    <td>
                      <span className={`status-pill ${statusClass[m.status]}`}>
                        <span className="status-dot"/>
                        {statusLabel[m.status]}
                      </span>
                    </td>
                    <td><span className="tbl-num">{m.chapters}</span></td>
                    <td>
                      {m.genres.slice(0,2).map(g=><span key={g} className="genre-tag">{g}</span>)}
                    </td>
                    <td style={{fontSize:11,color:'var(--muted)'}}>{m.updated}</td>
                    <td>
                      <div className="act-row">
                        <button className="act-btn">View</button>
                        <button className="act-btn edit">Edit</button>
                        <button className="act-btn chapters">Chapters</button>
                        <button className="act-btn cycle" onClick={()=>cycleStatus(m.id)} title="Status солих">
                          {CYCLE_LABEL[m.status]}
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="tbl-foot">
              <span>Нийт <b style={{color:'var(--text)'}}>{items.length}</b> манхуа{search&&` · хайлт: ${filtered.length}`}</span>
              <span style={{color:'var(--green)',fontSize:10,fontWeight:600}}>● EDITOR</span>
            </div>
          </div>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Editor"/>
        <TweakText label="Editor name" tweakKey="editorName"/>
        <TweakRadio label="Role" tweakKey="role" options={[{label:'Editor',value:'Editor'},{label:'Translator',value:'Translator'}]}/>
      </TweaksPanel>
    </>
  );
