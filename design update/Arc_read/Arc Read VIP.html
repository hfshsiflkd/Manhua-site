<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ARC•READ — VIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070e;--bg-card:#0d0d1a;--bg-el:#111120;
  --border:rgba(255,255,255,0.07);--border-h:rgba(255,255,255,0.14);
  --text:#e4e4f0;--muted:#6b6b80;--dim:#9494a8;
  --cyan:oklch(0.72 0.17 195);--cyan-g:oklch(0.72 0.17 195/.2);--cyan-d:oklch(0.72 0.17 195/.1);
  --rose:oklch(0.65 0.22 15);--amber:oklch(0.82 0.16 85);
  --purple:oklch(0.65 0.2 290);--purple-g:oklch(0.65 0.2 290/.15);
  --fh:'Space Grotesk',sans-serif;--fb:'DM Sans',sans-serif;
  --r:10px;--rl:16px;--mx:1100px;
}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;overflow-x:hidden;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg-el);border-radius:9px}
/* HEADER */
.hdr{position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);background:rgba(7,7,14,.9);backdrop-filter:blur(18px)}
.hdr-in{max-width:1280px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer}
.logo-icon{width:34px;height:34px;border-radius:9px;background:var(--bg-el);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.logo-txt{font-family:var(--fh);font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.logo-dot{color:var(--rose)}
.nav{display:flex;align-items:center;gap:2px}
.nl{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:500;color:var(--dim);cursor:pointer;transition:color .15s,background .15s}
.nl:hover{color:var(--text);background:rgba(255,255,255,.05)}
.hdr-r{display:flex;align-items:center;gap:8px}
.btn-in{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb)}
/* HERO */
.hero{
  position:relative;overflow:hidden;text-align:center;
  padding:80px 24px 64px;
}
.hero-bg{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,oklch(0.65 0.2 290/.14),transparent),
             radial-gradient(ellipse 50% 40% at 20% 80%,oklch(0.72 0.17 195/.08),transparent),
             radial-gradient(ellipse 50% 40% at 80% 80%,oklch(0.65 0.22 15/.06),transparent);
  pointer-events:none;
}
.hero-icon{
  width:80px;height:80px;border-radius:22px;
  background:linear-gradient(135deg,oklch(0.65 0.2 290/.3),oklch(0.82 0.16 85/.2));
  border:1px solid oklch(0.65 0.2 290/.3);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 24px;
  box-shadow:0 0 40px oklch(0.65 0.2 290/.2);
}
.hero-title{
  font-family:var(--fh);font-size:clamp(36px,6vw,60px);font-weight:800;
  letter-spacing:-.04em;
  background:linear-gradient(135deg,#fff 0%,var(--amber) 50%,oklch(0.82 0.16 60) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:14px;
}
.hero-sub{font-size:16px;color:var(--muted);max-width:480px;margin:0 auto 32px;line-height:1.6}
.vip-active-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:oklch(0.82 0.16 85/.1);border:1px solid oklch(0.82 0.16 85/.3);
  border-radius:20px;padding:8px 20px;
  font-size:13px;font-weight:600;color:var(--amber);
}
/* PLANS */
.plans-section{max-width:900px;margin:0 auto;padding:0 24px 80px}
.plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:700px){.plans-grid{grid-template-columns:1fr;max-width:400px;margin:0 auto}}
.plan-card{
  position:relative;border-radius:var(--rl);padding:28px 24px;
  border:1px solid var(--border);background:var(--bg-card);
  display:flex;flex-direction:column;gap:0;
  transition:transform .2s,border-color .2s;
}
.plan-card:hover{transform:translateY(-4px)}
.plan-popular{
  border-color:oklch(0.65 0.2 290/.5);
  background:linear-gradient(160deg,oklch(0.65 0.2 290/.08),var(--bg-card));
  box-shadow:0 0 40px oklch(0.65 0.2 290/.12),0 8px 32px rgba(0,0,0,.4);
}
.plan-popular-badge{
  position:absolute;top:-12px;left:50%;transform:translateX(-50%);
  padding:4px 16px;border-radius:20px;
  background:linear-gradient(90deg,var(--purple),oklch(0.72 0.17 195));
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;
  box-shadow:0 4px 12px oklch(0.65 0.2 290/.4);white-space:nowrap;
}
.plan-badge{
  display:inline-block;padding:3px 10px;border-radius:5px;
  font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:rgba(255,255,255,.06);color:var(--muted);margin-bottom:16px;
}
.plan-name{font-family:var(--fh);font-size:20px;font-weight:700;color:#fff;margin-bottom:4px}
.plan-price{font-family:var(--fh);font-size:36px;font-weight:800;color:#fff;letter-spacing:-.03em;margin-bottom:2px}
.plan-price span{font-size:16px;font-weight:400;color:var(--muted)}
.plan-per{font-size:12px;color:var(--muted);margin-bottom:20px}
.plan-features{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;flex:1}
.plan-feat{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--dim)}
.plan-feat-check{
  width:16px;height:16px;border-radius:5px;flex-shrink:0;margin-top:1px;
  background:var(--cyan-d);border:1px solid oklch(0.72 0.17 195/.3);
  display:flex;align-items:center;justify-content:center;
}
.plan-popular .plan-feat-check{background:oklch(0.65 0.2 290/.15);border-color:oklch(0.65 0.2 290/.4)}
.plan-btn{
  width:100%;padding:12px;border-radius:var(--r);
  font-family:var(--fh);font-size:14px;font-weight:700;
  border:none;cursor:pointer;transition:filter .15s,transform .1s;letter-spacing:-.01em;
}
.plan-btn-default{
  background:var(--bg-el);color:var(--text);
  border:1px solid var(--border);
}
.plan-btn-default:hover{border-color:var(--border-h);background:#18182e}
.plan-btn-popular{
  background:linear-gradient(135deg,var(--purple),oklch(0.72 0.17 195));
  color:#fff;box-shadow:0 0 24px oklch(0.65 0.2 290/.3);
}
.plan-btn-popular:hover{filter:brightness(1.1);transform:translateY(-1px)}
/* DISCOUNT BADGE */
.plan-save{
  display:inline-block;padding:2px 8px;border-radius:4px;
  background:oklch(0.65 0.22 15/.15);border:1px solid oklch(0.65 0.22 15/.3);
  font-size:10px;font-weight:700;color:var(--rose);margin-left:8px;
}
/* FEATURES GRID */
.features-section{max-width:900px;margin:0 auto 80px;padding:0 24px}
.features-title{font-family:var(--fh);font-size:22px;font-weight:700;color:#fff;text-align:center;margin-bottom:28px}
.features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:700px){.features-grid{grid-template-columns:1fr 1fr}}
.feat-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);
  padding:20px;display:flex;flex-direction:column;gap:10px;
}
.feat-icon{
  width:36px;height:36px;border-radius:9px;
  background:var(--purple-g);border:1px solid oklch(0.65 0.2 290/.2);
  display:flex;align-items:center;justify-content:center;
}
.feat-title{font-family:var(--fh);font-size:14px;font-weight:700;color:#fff}
.feat-desc{font-size:12px;color:var(--muted);line-height:1.5}
/* PAYMENT MODAL */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(7,7,14,.92);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;padding:24px}
.modal{
  width:100%;max-width:440px;
  background:var(--bg-card);border:1px solid var(--border);border-radius:20px;
  overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.7);
}
.modal-hdr{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:var(--fh);font-size:16px;font-weight:700;color:#fff}
.modal-close{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:24px}
.modal-plan-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:20px}
.modal-plan-name{font-family:var(--fh);font-size:15px;font-weight:700;color:#fff}
.modal-plan-price{font-family:var(--fh);font-size:20px;font-weight:800;color:var(--amber)}
.qr-area{
  background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r);
  padding:24px;text-align:center;margin-bottom:16px;
}
.qr-box{
  width:140px;height:140px;margin:0 auto 12px;
  border-radius:var(--r);overflow:hidden;
  background:repeating-linear-gradient(-45deg,#0d0d1a,#0d0d1a 4px,#111120 4px,#111120 8px);
  display:flex;align-items:center;justify-content:center;
}
.qr-label{font-size:11px;color:var(--muted)}
.modal-step{font-size:12px;color:var(--dim);margin-bottom:6px;display:flex;align-items:flex-start;gap:7px}
.step-num{
  width:18px;height:18px;border-radius:5px;flex-shrink:0;
  background:var(--cyan-d);font-size:10px;font-weight:700;color:var(--cyan);
  display:flex;align-items:center;justify-content:center;
}
.modal-confirm-btn{
  width:100%;padding:12px;border-radius:var(--r);margin-top:16px;
  background:var(--cyan);color:#07070e;
  font-size:14px;font-weight:700;font-family:var(--fh);
  border:none;cursor:pointer;box-shadow:0 0 22px var(--cyan-g);
  transition:filter .15s;
}
.modal-confirm-btn:hover{filter:brightness(1.1)}
@media(max-width:640px){.nav{display:none}}
</style>
</head>
<body>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

const PLANS = [
  {
    key:'monthly', name:'1 Сар', badge:'Эхлэгч',
    price:9900, per:'/ сар',
    popular:false,
    features:['Бүх VIP chapter унших','Урьдчилсан нэвтрэх','Зар харахгүй','VIP дэмжлэг'],
    save:null,
  },
  {
    key:'quarterly', name:'3 Сар', badge:'Алдартай',
    price:24900, per:'/ 3 сар',
    popular:true,
    features:['Бүх VIP chapter унших','Урьдчилсан нэвтрэх','Зар харахгүй','VIP дэмжлэг','Хүсэлт нэмэх + санал'],
    save:'15% хэмнэлт',
  },
  {
    key:'biannual', name:'6 Сар', badge:'Хамгийн сайн',
    price:44900, per:'/ 6 сар',
    popular:false,
    features:['Бүх VIP chapter унших','Урьдчилсан нэвтрэх','Зар харахгүй','VIP дэмжлэг','Хүсэлт нэмэх + санал','Тусгай VIP нэр шошго'],
    save:'25% хэмнэлт',
  },
];

const FEATURES = [
  {icon:'📚', title:'Хязгааргүй унших', desc:'VIP-д зориулсан бүх манхуа, бүх chapter-т нэвтрэх'},
  {icon:'⚡', title:'Хурдан шинэчлэл', desc:'Шинэ chapter гарахад та хамгийн түрүүнд уншина'},
  {icon:'🚫', title:'Зар байхгүй', desc:'Уншихдаа саад болох зар харахгүй цэвэр орчин'},
  {icon:'🗳️', title:'Хүсэлт санал', desc:'Дараагийн орчуулах манхуаг та шийднэ'},
  {icon:'🏷️', title:'VIP шошго', desc:'Профайл дээр тусгай VIP badge харуулна'},
  {icon:'💬', title:'VIP дэмжлэг', desc:'Асуудал гарвал хурдан хариу авна'},
];

function ArcMark(){
  return(
    <svg viewBox="0 0 48 48" width="22" height="22" fill="none">
      <path d="M8 28 C14 14 34 14 40 28" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
      <path d="M16 34 C20 30 28 30 32 34" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
      <circle cx="24" cy="12" r="3" fill="oklch(0.65 0.22 15)"/>
    </svg>
  );
}

function PaymentModal({plan, onClose}){
  const [confirmed, setConfirmed] = useState(false);
  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-hdr">
          <div className="modal-title">VIP худалдан авах</div>
          <button className="modal-close" onClick={onClose}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div className="modal-body">
          {!confirmed ? (
            <>
              <div className="modal-plan-row">
                <div>
                  <div className="modal-plan-name">{plan.name} VIP</div>
                  <div style={{fontSize:11,color:'var(--muted)'}}>{plan.per}</div>
                </div>
                <div className="modal-plan-price">{plan.price.toLocaleString()}₮</div>
              </div>
              <div className="qr-area">
                <div className="qr-box">
                  <svg width="60" height="60" viewBox="0 0 60 60" fill="none" opacity="0.2">
                    <rect x="5" y="5" width="20" height="20" rx="2" stroke="currentColor" strokeWidth="2"/>
                    <rect x="10" y="10" width="10" height="10" fill="currentColor"/>
                    <rect x="35" y="5" width="20" height="20" rx="2" stroke="currentColor" strokeWidth="2"/>
                    <rect x="40" y="10" width="10" height="10" fill="currentColor"/>
                    <rect x="5" y="35" width="20" height="20" rx="2" stroke="currentColor" strokeWidth="2"/>
                    <rect x="10" y="40" width="10" height="10" fill="currentColor"/>
                    <rect x="35" y="35" width="5" height="5" fill="currentColor"/>
                    <rect x="43" y="35" width="5" height="5" fill="currentColor"/>
                    <rect x="35" y="43" width="5" height="5" fill="currentColor"/>
                    <rect x="43" y="43" width="12" height="12" fill="currentColor"/>
                  </svg>
                </div>
                <div className="qr-label">QPay / Монпэй QR код<br/><span style={{fontSize:10,opacity:.5}}>bank transfer placeholder</span></div>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:4}}>
                {['QPay эсвэл Монпэй апп нээнэ үү','QR кодыг скан хийж {plan.price.toLocaleString()}₮ төлнө үү','Доорх товчийг дарж баталгаажуулна уу'].map((s,i)=>(
                  <div key={i} className="modal-step">
                    <span className="step-num">{i+1}</span>
                    <span>{s.replace('{plan.price.toLocaleString()}₮',`${plan.price.toLocaleString()}₮`)}</span>
                  </div>
                ))}
              </div>
              <button className="modal-confirm-btn" onClick={()=>setConfirmed(true)}>
                Төлбөр хийгдлээ →
              </button>
            </>
          ):(
            <div style={{textAlign:'center',padding:'20px 0'}}>
              <div style={{fontSize:48,marginBottom:16}}>✅</div>
              <div style={{fontFamily:'var(--fh)',fontSize:18,fontWeight:700,color:'#fff',marginBottom:8}}>Баталгаажлаа!</div>
              <div style={{fontSize:13,color:'var(--muted)',marginBottom:24}}>Таны {plan.name} VIP эрх идэвхжлээ. Дахин нэвтэрч орно уу.</div>
              <button className="modal-confirm-btn" onClick={onClose}>Хаах</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "isVip": false,
  "highlightPlan": "quarterly"
}/*EDITMODE-END*/;

function App(){
  const [tweaks,setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [selectedPlan, setSelectedPlan] = useState(null);
  const navItems=['Нүүр','Жагсаалт','Leaderboard','Хүсэлт','Профайл'];

  return(
    <div style={{minHeight:'100vh'}}>
      <header className="hdr">
        <div className="hdr-in">
          <a className="logo" href="Arc Read Homepage.html">
            <div className="logo-icon"><ArcMark/></div>
            <span className="logo-txt">ARC<span className="logo-dot">•</span>READ</span>
          </a>
          <nav className="nav">
            {navItems.map(n=><a key={n} className="nl">{n}</a>)}
          </nav>
          <div className="hdr-r">
            <button className="btn-in">Нэвтрэх</button>
          </div>
        </div>
      </header>

      {/* HERO */}
      <div className="hero">
        <div className="hero-bg"/>
        <div className="hero-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="oklch(0.82 0.16 85)" strokeWidth="1.8">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        </div>
        <h1 className="hero-title">VIP гишүүнчлэл</h1>
        <p className="hero-sub">Манхуа уншихын тулд хамгийн дээд туршлагыг мэдэрнэ үү. Хязгааргүй нэвтрэх, хурдан шинэчлэл.</p>
        {tweaks.isVip && (
          <div className="vip-active-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            VIP идэвхтэй · 45 өдөр үлдсэн · 2025/06/30 дуусна
          </div>
        )}
      </div>

      {/* PLANS */}
      <div className="plans-section">
        <div className="plans-grid">
          {PLANS.map(p=>(
            <div key={p.key} className={`plan-card${p.popular?' plan-popular':''}`}>
              {p.popular && <div className="plan-popular-badge">Most Popular</div>}
              <div className="plan-badge">{p.badge}</div>
              <div className="plan-name">{p.name}</div>
              <div>
                <span className="plan-price">{p.price.toLocaleString()}<span>₮</span></span>
                {p.save && <span className="plan-save">{p.save}</span>}
              </div>
              <div className="plan-per">{p.per}</div>
              <div className="plan-features">
                {p.features.map(f=>(
                  <div key={f} className="plan-feat">
                    <div className="plan-feat-check">
                      <svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="var(--cyan)" strokeWidth="2" strokeLinecap="round"><path d="M2 6l3 3 5-5"/></svg>
                    </div>
                    {f}
                  </div>
                ))}
              </div>
              <button
                className={`plan-btn${p.popular?' plan-btn-popular':' plan-btn-default'}`}
                onClick={()=>setSelectedPlan(p)}
              >
                {tweaks.isVip ? 'Сунгах' : 'Авах'}
              </button>
            </div>
          ))}
        </div>
      </div>

      {/* FEATURES */}
      <div className="features-section">
        <div className="features-title">VIP давуу тал</div>
        <div className="features-grid">
          {FEATURES.map(f=>(
            <div key={f.title} className="feat-card">
              <div className="feat-icon" style={{fontSize:18}}>{f.icon}</div>
              <div className="feat-title">{f.title}</div>
              <div className="feat-desc">{f.desc}</div>
            </div>
          ))}
        </div>
      </div>

      {selectedPlan && <PaymentModal plan={selectedPlan} onClose={()=>setSelectedPlan(null)}/>}

      <TweaksPanel>
        <TweakSection label="Preview"/>
        <TweakToggle label="Already VIP" tweakKey="isVip"/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
